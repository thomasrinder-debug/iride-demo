<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streckenkatalog</title>
<link rel="stylesheet" href="../vendor/leaflet.css">
<script src="../vendor/leaflet.js"></script>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --text:#1d1d1b; --muted:#6b6a66; --line:#e2e0db; --accent:#1f5f8b;
          --A:#2e8b57; --B:#d9a400; --C:#c0392b; --K:#3a7bd5; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--text); background:var(--bg);
         display:grid; grid-template-columns: 360px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .filter { padding:12px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
  .filter h1 { font-size:17px; margin:0; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); border-radius:14px; padding:3px 10px; cursor:pointer; user-select:none; background:#fff; }
  .chip.an { color:#fff; border-color:transparent; }
  .reihe { display:flex; gap:6px; align-items:center; }
  select, input[type=search] { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; flex:1; min-width:0; }
  .feld { display:inline-block; width:78px; }
  input[type=number] { font:inherit; width:60px; padding:4px; border:1px solid var(--line); border-radius:6px; }
  #anzahl { color:var(--muted); font-size:12px; }
  .chip.wahl { background:var(--accent); color:#fff; border-color:transparent; }
  #aktiv { background:#fbf3e4; border-radius:6px; padding:5px 8px; }
  #aktiv:empty { display:none; }
  #aktiv button { font:inherit; font-size:12px; padding:1px 8px; margin-left:6px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  #liste { overflow:auto; flex:1; }
  .eintrag { padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:22px 1fr 96px; gap:8px; align-items:start; }
  .eintrag img, .eintrag .leer { width:96px; height:54px; object-fit:cover; border-radius:4px; background:#e8e6e1; }
  #fotos { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:6px 0 10px; }
  #fotos figure { margin:0; cursor:pointer; }
  #fotos img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:6px; display:block; }
  #fotos figcaption { font-size:11px; color:var(--muted); }
  .eintrag:hover { background:#f2f6f9; }
  .eintrag.aktiv { background:#e6eff6; }
  .stufe { width:22px; height:22px; border-radius:5px; color:#fff; font-weight:600; display:grid; place-items:center; font-size:11px;
           text-shadow:0 0 2px rgba(0,0,0,.6); }
  .name { font-weight:600; }
  .stern { cursor:pointer; color:#c9a227; font-size:16px; line-height:1; user-select:none; }
  .gefahren { color:var(--accent); font-size:12px; font-weight:600; }
  #hist { overflow:auto; flex:1; display:none; }
  #hist.an { display:block; }
  .fahrt { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .fahrt:hover { background:#f2f6f9; }
  body:not(.iride) .nurIride { display:none !important; }
  #histKnopf { font:inherit; font-size:12px; padding:2px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; margin-left:8px; }
  .klein { color:var(--muted); font-size:12px; }
  /* Karte behält die volle Höhe; Details stehen breit rechts daneben, schmaler darunter (eigene Scrollleiste) */
  main { display:grid; grid-template-columns: 1fr; grid-template-rows: 1fr; min-height:0; }
  main.mitDetail { grid-template-columns: 1fr minmax(420px, 32vw); }
  #karte { min-height:0; }
  #detail { background:var(--panel); border-left:1px solid var(--line); padding:12px 16px; display:none; overflow:auto; min-height:0; }
  #detail.sichtbar { display:block; }
  #schliessen { font:inherit; border:none; background:none; font-size:20px; line-height:1; cursor:pointer; color:var(--muted); padding:0 4px; }
  #kopf { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  #kopf h2 { margin:0; font-size:18px; }
  #fahren { font:inherit; font-weight:600; padding:8px 16px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; margin-left:auto; }
  .werte { display:grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap:8px 14px; margin:8px 0; }
  .wert b { display:block; font-size:18px; }
  .wert span { color:var(--muted); font-size:12px; }
  #profil { width:100%; height:170px; display:block; }
  .text { display:grid; grid-template-columns: 1fr; gap:6px; margin-top:8px; font-size:13px; }
  .hinweis { color:#a0522d; }
  a { color:var(--accent); }
  .uebersicht { font:inherit; font-weight:600; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .legende { display:flex; gap:10px; font-size:11px; color:var(--muted); }
  .legende i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:3px; vertical-align:-1px; }
  @media (max-width: 1300px) {
    main.mitDetail { grid-template-columns: 1fr; grid-template-rows: 62vh auto; overflow:auto; }
    #detail { border-left:none; border-top:1px solid var(--line); overflow:visible; }
  }
  @media (max-width: 900px) {
    body { display:block; height:auto; }
    aside { border-right:none; }
    #liste { max-height:38vh; }
    main { display:block; }
    #karte { height:55vh; }
  }
</style>
</head>
<body>
<aside>
  <div class="filter">
    <h1>Streckenkatalog <a id="zuIride" href="../" style="display:none;font-size:13px;font-weight:400;margin-left:8px">← iRide</a><button id="histKnopf" class="nurIride">Historie</button></h1>
    <!-- Jeder Filter prüft genau eine Größe, alle gelten zusammen (UND), keiner verstellt einen anderen;
         leer = keine Einschränkung. Alles Aktive steht in #aktiv, mit Zahl der allein dadurch ausgeblendeten. -->
    <div class="chips" id="sammlung" title="Sammlung: wofür die Strecke gebaut wurde"></div>
    <div class="chips nurIride" id="ich"></div>
    <div class="reihe"><input type="search" id="suche" placeholder="Suche: Name, Ort, Land"></div>
    <div class="reihe klein"><span class="feld">Fahrzeit</span> <input type="number" id="zeitMin" min="0" step="10" placeholder="0"> –
      <input type="number" id="zeitMax" min="0" step="10" placeholder="∞"> min <span id="kcal"></span></div>
    <div class="reihe klein"><span class="feld">steilster km</span> <input type="number" id="steilMin" min="0" step="0.5" placeholder="0"> –
      <input type="number" id="steilMax" min="0" step="0.5" placeholder="∞"> %</div>
    <div class="reihe klein"><span class="feld">Höhenmeter</span> <input type="number" id="hmMin" min="0" step="100" placeholder="0"> –
      <input type="number" id="hmMax" min="0" step="100" placeholder="∞"> hm</div>
    <div class="reihe"><select id="land"><option value="">alle Länder</option></select>
      <select id="sort"><option value="zeit">nach Fahrzeit</option><option value="steil">nach steilstem km</option>
      <option value="steig">nach Ø Steigung</option><option value="hm">nach Höhenmetern</option><option value="sv">nach Street View</option><option value="zuletzt" class="nurIride">zuletzt gefahren</option></select></div>
    <div class="legende" title="Farbe in Karte und Liste: steilster km">steilster km
      <span><i style="background:#9cc58a"></i>&lt; 3</span><span><i style="background:#e8cf4a"></i>3–5</span>
      <span><i style="background:#ef9a3c"></i>5–7</span><span><i style="background:#d9452b"></i>7–9</span>
      <span><i style="background:#7a1d1d"></i>&gt; 9 %</span></div>
    <label class="klein"><input type="checkbox" id="sauber"> nur saubere Strecken (Route passt, kein Wander-/Feldweg, Street View ≥ 70 %)</label>
    <label class="klein"><input type="checkbox" id="nurAusschnitt"> Liste nur mit Strecken im Kartenausschnitt</label>
    <div id="aktiv" class="klein"></div>
    <div id="anzahl"></div>
  </div>
  <div id="liste"></div>
  <div id="hist"></div>
</aside>
<main>
  <div id="karte"></div>
  <section id="detail">
    <div id="kopf"><span id="dStern" class="stern nurIride" title="Favorit">☆</span><h2 id="dName"></h2><span class="klein" id="dOrt"></span>
      <button id="fahren" style="display:none">In iRide fahren</button>
      <button id="schliessen" title="Schließen, zurück zum vorigen Kartenausschnitt (Esc)">×</button></div>
    <div class="werte" id="dWerte"></div>
    <div id="fotos"></div>
    <svg id="profil"></svg>
    <div class="legende">
      <span><i style="background:#9cc58a"></i>&lt; 3 %</span><span><i style="background:#e8cf4a"></i>3–5 %</span>
      <span><i style="background:#ef9a3c"></i>5–7 %</span><span><i style="background:#d9452b"></i>7–9 %</span>
      <span><i style="background:#7a1d1d"></i>&gt; 9 %</span>
    </div>
    <div class="text" id="dText"></div>
  </section>
</main>

// Jeder aktive Filter: Text für die Aktiv-Zeile und Test; so lässt sich zählen, wie viele er allein ausblendet
function aktiveFilter() {
  const f = [], v = i => el(i).value;
  if (wahl.sammlung) f.push([SAMMLUNG.find(x => x[0] === wahl.sammlung)[1], d => sammlung(d) === wahl.sammlung]);
  if (imIride && wahl.ich) f.push([ICH.find(x => x[0] === wahl.ich)[1],
    d => wahl.ich === "fav" ? fav.has(d.id) : wahl.ich === "gefahren" ? !!gefahren[d.id] : !gefahren[d.id]]);
  const q = v("suche").trim().toLowerCase();
  if (q) f.push([`„${v("suche").trim()}“`, d => (d.name + " " + d.land + " " + landName(d.land) + " " + d.region).toLowerCase().includes(q)]);
  if (v("zeitMin") !== "") f.push([`≥ ${v("zeitMin")} min`, d => d.zeit >= +v("zeitMin")]);
  if (v("zeitMax") !== "") f.push([`≤ ${v("zeitMax")} min`, d => d.zeit <= +v("zeitMax")]);
  if (v("steilMin") !== "") f.push([`steilster km ≥ ${v("steilMin")} %`, d => d.max1000 >= +v("steilMin")]);
  if (v("steilMax") !== "") f.push([`steilster km ≤ ${v("steilMax")} %`, d => d.max1000 <= +v("steilMax")]);
  if (v("hmMin") !== "") f.push([`≥ ${v("hmMin")} hm`, d => d.hm >= +v("hmMin")]);
  if (v("hmMax") !== "") f.push([`≤ ${v("hmMax")} hm`, d => d.hm <= +v("hmMax")]);
  if (v("land")) f.push([landName(v("land")), d => d.land === v("land")]);
  if (el("sauber").checked) f.push(["nur saubere", sauber]);
  return f;
}

function gefiltert() {
  const f = aktiveFilter(), sort = el("sort").value;
  const treffer = DATEN.filter(d => f.every(([, t]) => t(d)));
  // ausgeblendet je Filter: Strecken, die alle anderen Filter bestehen, nur diesen nicht
  const weg = f.map(([text, t]) => [text, DATEN.filter(d => !t(d) && f.every(([x, u]) => x === text || u(d))).length]);
  const ab = el("zeitMin").value, bis = el("zeitMax").value;
  el("kcal").textContent = ab || bis ? `≈ ${ab ? kcal(+ab) : 0}–${bis ? kcal(+bis) : "∞"} kcal` : "";

    + ` <button id="zurueck">Filter zurücksetzen</button>` : "";

}

function profil(d) {

  const Y = h => o + (1 - (h - hmin) / sp) * (H - o - u);

    const b = Math.min(a + 5, d.s.length - 1);

    let pts = `${X(d.s[a])},${H - u}`;
    for (let i = a; i <= b; i++) pts += ` ${X(d.s[i])},${Y(d.h[i])}`;
    html += `<polygon fill="${farbeSteigung(g)}" points="${pts} ${X(d.s[b])},${H - u}"/>`;

    html += `<text x="${X(k * 1000)}" y="${H - 6}" font-size="11" fill="#6b6a66" text-anchor="middle">${k}</text>`;
  for (const h of [hmin, hmax])
    html += `<text x="${l - 4}" y="${Y(h) + 4}" font-size="11" fill="#6b6a66" text-anchor="end">${Math.round(h)} m</text>`;
  html += `<line id="pLinie" y1="${o}" y2="${H - u}" stroke="#111" stroke-width="1" visibility="hidden"/>

    const p = ev.touches ? ev.touches[0] : ev, rect = svg.getBoundingClientRect();
    const s = Math.max(0, Math.min(1, (p.clientX - rect.left - l) / (B - l - r))) * d.s[d.s.length - 1];
    let i = d.s.findIndex(x => x >= s); if (i < 1) i = 1;
    const g = 100 * (d.h[i] - d.h[i - 1]) / (d.s[i] - d.s[i - 1]);
    const lin = el("pLinie"), t = el("pText");
    lin.setAttribute("x1", X(s)); lin.setAttribute("x2", X(s)); lin.setAttribute("visibility", "visible");
    t.setAttribute("x", Math.min(X(s) + 6, B - 150));
    t.textContent = `km ${fmt(s / 1000)} · ${Math.round(d.h[i])} m · ${fmt(g)} %`;
    marker.setLatLng([d.lat[i], d.lon[i]]).addTo(karte);
  };
}

// Kartenausschnitt vor der ersten Auswahl; X/Esc kehrt dorthin zurück (Durchklicken mehrerer Strecken ändert ihn nicht)
let vorher = null;
function waehle(id) {
  if (aktiv === null) vorher = { mitte: karte.getCenter(), zoom: karte.getZoom() };
  const d = DATEN.find(x => x.id === id); aktiv = id;
  for (const [k, l] of Object.entries(linien)) l.setStyle({ weight: k === id ? 7 : 4, opacity: k === id ? 1 : 0.5 });
  linien[id].bringToFront();
  el("detail").classList.add("sichtbar"); document.querySelector("main").classList.add("mitDetail");
  karte.invalidateSize();
  karte.fitBounds(linien[id].getBounds(), { padding: [30, 30] });
  el("detail").scrollTop = 0;
  el("dName").innerHTML = `${kaestchen(d)} ${esc(d.name)}`;
  el("dOrt").textContent = [d.region, d.land].filter(Boolean).join(", ");
  el("dStern").textContent = fav.has(id) ? "★" : "☆";
  const meine = historie.filter(f => katalogId(f.kurs) === id).reverse();
  const w = [["km", fmt(d.km)], ["Höhenmeter", fmt(d.hm, 0)], d.rund ? ["Ø bergauf", fmt(d.bergauf) + " %"] : ["Ø Steigung", fmt(d.mittel) + " %"],
    ["steilster km", fmt(d.max1000) + " %"], ["Anteil > 7 %", fmt(d.ueber7, 0) + " %"],
    [`Zeit bei ${d.lernW} W`, fmt(d.zeit, 0) + " min"], 
    ["Street View", d.sv == null ? "–" : `${fmt(d.sv, 0)} % (${d.svJahr ?? "?"})`]];
  el("dWerte").innerHTML = w.map(([k, v]) => `<div class="wert"><b>${v}</b><span>${k}</span></div>`).join("");
  el("fotos").innerHTML = d.fotos.map(f => `<figure data-km="${f.km}"><img src="${esc(f.datei)}" alt="">
    <figcaption>km ${fmt(f.km)} · © Google</figcaption></figure>`).join("");
  el("fotos").querySelectorAll("figure").forEach(f => f.onclick = () => {
    const s = +f.dataset.km * 1000, i = Math.max(0, d.s.findIndex(x => x >= s));
    marker.setLatLng([d.lat[i], d.lon[i]]).addTo(karte);
    karte.setView([d.lat[i], d.lon[i]], 15);
  });
  const sv = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${d.lat[0]},${d.lon[0]}`;
  const t = d.text || {};
  el("dText").innerHTML = [
    t.szenerie && `<div><b>Landschaft:</b> ${esc(t.szenerie)}</div>`,
    t.strassen && `<div><b>Straßen:</b> ${esc(t.strassen)} · ${esc(t.belag || "")}</div>`,
    t.verkehr && `<div><b>Verkehr:</b> ${esc(t.verkehr)}</div>`,
    t.sperren && `<div><b>Maut/Sperren:</b> ${esc(t.sperren)}</div>`,
    t.reise && `<div><b>Reise:</b> ${esc(t.reise)}</div>`,
    t.bekannt && `<div><b>Bekannt aus:</b> ${esc(t.bekannt)}</div>`,
    meine.length && `<div><b>Gefahren:</b> ${meine.map(f => esc(fahrtText(f))).join("<br>")}</div>`,
    d.hinweise && `<div class="hinweis"><b>Prüfung:</b> ${esc(d.hinweise)}</div>`,
    t.unsicher && `<div class="klein"><b>Unsicher laut Recherche:</b> ${esc(t.unsicher)}</div>`,
    `<div><a href="kickr/${encodeURIComponent(d.id)}.gpx" download>Kickr-GPX (mit ${d.vorlauf} km flach)</a> · <a href="gpx/${encodeURIComponent(d.id)}.gpx" download>GPX Strecke</a> ·<a href="${sv}" target="_blank" rel="noopener">Street View am Start</a>`
      + (t.quellen || []).map((q, i) => ` · <a href="${esc(q)}" target="_blank" rel="noopener">Quelle ${i + 1}</a>`).join("") + `</div>`
  ].filter(Boolean).join("");
  profil(d);
  zeige();
  el("liste").querySelector(".eintrag.aktiv")?.scrollIntoView({ block: "nearest" });
}

function fahrtText(f) {
  const min = Math.round(f.fahrzeit / 60);
  return `${datum(f.datum)} · ${min} min · ${fmt(f.km)} km` + (f.ziel ? " · Ziel" : ` · ${Math.round(100 * f.anteil)} %`)
    + (f.w ? ` · Ø ${f.w} W` : "") + (f.hf ? ` · ${f.hf} bpm` : "") + (f.kad ? ` · ${f.kad} rpm` : "");
}
function nutzerAuswerten() {
  gefahren = {};
  for (const f of historie) {
    const g = gefahren[katalogId(f.kurs)] ||= { n: 0, zuletzt: "" };
    g.n++; if (f.datum > g.zuletzt) g.zuletzt = f.datum;
  }
}
async function favorit(id) {
  const an = !fav.has(id);
  const r = await fetch(`/api/favorit?id=${encodeURIComponent(id)}&an=${an ? 1 : 0}`, { method: "POST" });
  if (!r.ok) return;
  fav = new Set(await r.json());
  if (aktiv === id) el("dStern").textContent = an ? "★" : "☆";
  zeige();
}
// Historie: alle Fahrten, neueste oben; Klick öffnet die Strecke (wenn sie im Katalog ist)
function zeigeHistorie() {
  const an = el("hist").classList.toggle("an");
  el("liste").style.display = an ? "none" : "";
  el("histKnopf").textContent = an ? "Liste" : "Historie";
  if (!an) return;
  const namen = Object.fromEntries(DATEN.map(d => [d.id, d.name]));
  el("hist").innerHTML = historie.length ? [...historie].reverse().map(f => `
    <div class="fahrt" data-id="${esc(katalogId(f.kurs))}"><div class="name">${esc(namen[katalogId(f.kurs)] || f.name)}</div>
    <div class="klein">${esc(fahrtText(f))}</div></div>`).join("") : `<div class="fahrt klein">noch keine Fahrten</div>`;
  el("hist").querySelectorAll(".fahrt[data-id]").forEach(e => e.onclick = () => {
    if (namen[e.dataset.id]) waehle(e.dataset.id);
  });
}

// Über den iRide-Server (/katalog/): Strecke in den Kursordner übernehmen und in iRide öffnen
if (imIride) {
  document.body.classList.add("iride");
  el("histKnopf").onclick = zeigeHistorie;
  el("dStern").onclick = () => aktiv && favorit(aktiv);
  fetch("/api/nutzer").then(r => r.ok ? r.json() : null).then(n => {
    if (!n) return;
    fav = new Set(n.favoriten || []); historie = n.historie || [];
    nutzerAuswerten(); zeige();
  }).catch(() => {});
  el("zuIride").style.display = "inline"; el("fahren").style.display = "inline-block";
  el("fahren").onclick = async () => {
    const b = el("fahren"); b.disabled = true; b.textContent = "übernehme, schicke an den Edge …";
    try {
      const r = await fetch("/api/uebernehmen?id=" + encodeURIComponent(aktiv), { method: "POST" });
      if (!r.ok) throw new Error(await r.text());
      const { kurs, garmin } = await r.json();
      // iRide liest den zuletzt gewählten Kurs aus localStorage (gleicher Ursprung), Start bei 0
      try { localStorage.setItem("kickrAnzeige", JSON.stringify({ kurs })); } catch (e) {}
      // Ergebnis der Garmin-Übertragung kurz zeigen (bei Fehler länger), dann zu iRide
      if (garmin) b.textContent = "Edge: " + garmin;
      setTimeout(() => { location.href = "/"; }, !garmin ? 0 : garmin.startsWith("an den Edge") ? 1500 : 6000);
    } catch (e) { b.textContent = "Fehler: " + e.message; b.disabled = false; }
  };
}

// Auswahl aufheben und Details schließen, Kartenausschnitt bleibt
function abwaehlen() {
  aktiv = null; marker.remove();
  for (const l of Object.values(linien)) l.setStyle({ weight: 4, opacity: 0.85 });
  el("detail").classList.remove("sichtbar"); document.querySelector("main").classList.remove("mitDetail");
  karte.invalidateSize();
  zeige();
}
// „Alle Strecken“: auf alle gefilterten Strecken zoomen
function uebersicht() {
  abwaehlen(); vorher = null;
  const sichtbar = Object.values(linien).filter(l => karte.hasLayer(l));
  if (sichtbar.length) karte.fitBounds(L.featureGroup(sichtbar).getBounds(), { padding: [20, 20], maxZoom: 9 });
  setTimeout(() => karte.invalidateSize(), 50);
}
// X/Esc: zurück zum Ausschnitt vor der Auswahl (ohne gemerkten Ausschnitt wie „Alle Strecken“)
function schliessen() {
  if (!vorher) return uebersicht();
  const v = vorher; vorher = null;
  abwaehlen();
  karte.setView(v.mitte, v.zoom, { animate: false });
  setTimeout(() => { karte.invalidateSize(); karte.setView(v.mitte, v.zoom, { animate: false }); }, 50);
}
const Uebersicht = L.Control.extend({
  options: { position: "topleft" },
  onAdd() {
    const b = L.DomUtil.create("button", "uebersicht");
    b.textContent = "Alle Strecken"; b.title = "Auf alle gefilterten Strecken zoomen";
    L.DomEvent.disableClickPropagation(b);
    b.onclick = uebersicht;
    return b;
  },
});
new Uebersicht().addTo(karte);
document.addEventListener("keydown", e => { if (e.key === "Escape" && aktiv !== null) schliessen(); });
el("schliessen").onclick = schliessen;

zeige();
uebersicht();
}
</script>
