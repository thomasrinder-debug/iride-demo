<title>Kickr-Anzeige</title>
<script>
// Fehler sichtbar machen und ins Server-Log schicken (iPad hat keine Konsole)
// „Script error. @:0“ kommt aus einem fremden Skript (Bluefys Bluetooth-Brücke, Google Maps): der Browser verbirgt
// Text und Zeile. Deshalb geht der Zustand der Seite mit ins Protokoll (irideKontext, im Hauptblock gesetzt).
// Das Band schließt sich nach FEHLER_BAND_MS oder per Antippen, damit es nicht die Leiste verdeckt.
const FEHLER_BAND_MS = 20000;
function fehlerMelden(text) {
  let kontext = "";
  try { if (typeof window.irideKontext === "function") kontext = " | " + window.irideKontext(); } catch (e) {}
  try { fetch("fehler?" + encodeURIComponent((String(text) + kontext).slice(0, 500))); } catch (e) {}
  const fremd = /^Script error\.?\s*@?:?0?$/.test(String(text).trim());
  const zeigen = () => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#b62324;color:#fff;font:16px sans-serif;padding:8px";
    d.textContent = (fremd ? "Fehler in einem fremden Skript (Bluefy/Google), Zustand ist protokolliert" : "Fehler: " + text)
      + " · antippen schließt";
    d.onclick = () => d.remove();
    setTimeout(() => d.remove(), FEHLER_BAND_MS);
    document.body.appendChild(d);
  };
  document.body ? zeigen() : addEventListener("DOMContentLoaded", zeigen);
}
addEventListener("error", e => fehlerMelden(e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno));
addEventListener("unhandledrejection", e => fehlerMelden("Promise: " + (e.reason && e.reason.message || e.reason)));
fetch("fehler?start " + encodeURIComponent(navigator.userAgent + " bluetooth=" + !!navigator.bluetooth
  + " getDevices=" + !!(navigator.bluetooth && navigator.bluetooth.getDevices)));
</script>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js" onerror="fehlerMelden('Leaflet (vendor) nicht geladen')"></script>
<script src="vendor/leaflet-rotate-src.js" onerror="fehlerMelden('leaflet-rotate (vendor) nicht geladen')"></script>
<script src="vendor/hoehenlinien.js?v=3" onerror="fehlerMelden('hoehenlinien (vendor) nicht geladen')"></script>
<style>
  :root {
    --bg: #101214; --panel: #1b1e22; --rand: #2c3138; --text: #eef1f4; --gedimmt: #8b949e;
    --gruen: #3fb950; --gelb: #d29922; --orange: #f0883e; --rot: #f85149; --dunkelrot: #b62324;
    --akzent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; }
  /* Street View | Karte hochkant | Werte; ohne Panorama ist die Karte groß und die Mittelspalte entfällt */
  body { display: grid; grid-template-columns: 1fr minmax(170px, 17vw) minmax(280px, 26vw);
    grid-template-rows: auto 1fr 22vh; gap: 6px; padding: 6px;
    padding-left: max(6px, env(safe-area-inset-left)); padding-right: max(6px, env(safe-area-inset-right)); }
  body:has(#kartenslot.leer) { grid-template-columns: 1fr minmax(300px, 30vw); }
  #leiste { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #leiste button, #leiste select { font-size: 16px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--rand); background: var(--panel); color: var(--text); }
  #leiste button.an { background: var(--akzent); color: #000; border-color: var(--akzent); }
  #leiste button.zurueck { font-size: 12px; padding: 4px 8px; opacity: .55; }
  #leiste button.sucht { border-style: dashed; color: var(--gedimmt); }
  #leiste button#btnAlle { background: var(--akzent); color: #000; border-color: var(--akzent); font-weight: 600; }
  #leiste .gruppe { display: flex; gap: 4px; align-items: center; }
  #status { color: var(--gedimmt); font-size: 14px; margin-left: auto; }
  /* Leiste klappt beim Rollen weg (Zeile 1 des Grids fällt auf 0), Griff oben mittig holt sie zurück */
  /* nicht display:none – sonst rücken Profil & Co. per Auto-Platzierung in Zeile 1 */
  body.leisteZu #leiste { visibility: hidden; height: 0; overflow: hidden; }
  #leisteGriff { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 50;
    padding: 2px 22px 6px; font-size: 16px; line-height: 1; border: 1px solid var(--rand); border-top: 0;
    border-radius: 0 0 10px 10px; background: rgba(27,30,34,.55); color: var(--gedimmt); }
  body.leisteZu #leisteGriff { display: block; }
  body.leisteZu #hinweis { top: 30px; }
  #simRegler { display: none; gap: 6px; align-items: center; font-size: 15px; }
  #simRegler.an { display: flex; }
  #simRegler input { width: 140px; }
  #haupt { position: relative; border-radius: 10px; overflow: hidden; background: var(--panel); }
  #sv, #sv2 { position: absolute; inset: 0; transition: opacity .8s ease-in-out, transform .25s linear; }
  #sv { z-index: 1; }
  #sv2 { opacity: 0; z-index: 0; }
  /* Bewegung zwischen zwei Panoramen: leichtes Hineinzoomen per CSS (GPU, keine Google-Abfragen) */
  #sv, #sv2 { transform-origin: 50% 55%; will-change: transform, opacity; }
  #einblendung { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 26; display: none;
    max-width: 78%; padding: 6px 16px; border-radius: 10px; background: rgba(16,18,20,.82); color: var(--text);
    font-size: clamp(15px, 2.4vh, 24px); font-weight: 600; text-align: center; pointer-events: none; }
  #einblendung.an { display: block; }
  #einblendung small { display: block; font-size: .7em; font-weight: 400; color: var(--gedimmt); }
  #geist { position: absolute; right: 10px; top: 10px; z-index: 12; display: none; padding: 4px 10px; border-radius: 8px;
    background: rgba(16,18,20,.78); font-size: clamp(14px, 2.2vh, 22px); font-weight: 700; pointer-events: none;
    font-variant-numeric: tabular-nums; }
  #geist.an { display: block; } #geist.vor { color: var(--gruen); } #geist.hinter { color: var(--orange); }
  #gipfel { position: absolute; inset: 0; z-index: 21; display: none; flex-direction: column; align-items: center;
    justify-content: center; background: rgba(0,0,0,.5); text-align: center; pointer-events: none; }
  #gipfel.an { display: flex; }
  #gipfel b { font-size: 9vh; } #gipfel span { font-size: 4vh; font-weight: 700; } #gipfel small { font-size: 3vh; color: var(--gruen); }
  body.overlay #einblendung { bottom: calc(9vh + 100px); }
  body.overlay #geist { top: calc(8vh + 44px); }
  #haupt > #karte { position: absolute; inset: 0; z-index: 5; }
  #seite { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  #kartenslot { border-radius: 10px; overflow: hidden; position: relative; min-height: 0; }
  #kartenslot.leer { display: none; }
  #kartenslot > #karte { position: absolute; inset: 0; }
  #werte { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1.5fr repeat(4, 1fr);
    gap: 6px; min-height: 0; }
  .wert { background: var(--panel); border-radius: 10px; padding: 4px 10px; display: flex;
    flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
  .wert .t { font-size: clamp(11px, 1.4vh, 16px); color: var(--gedimmt); text-transform: uppercase;
    letter-spacing: .05em; }
  .wert .z { font-size: clamp(20px, 4.4vh, 64px); font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1.05; white-space: nowrap; }
  .wert .z small { font-size: .45em; font-weight: 500; color: var(--gedimmt); margin-left: 3px; }
  .wert.gross { grid-column: 1 / 3; display: grid; grid-template-columns: auto 1fr;
    grid-template-rows: auto 1fr; align-items: center; column-gap: 14px; }
  .wert.gross .t { grid-column: 1 / 3; }
  .wert.gross .u { white-space: normal; line-height: 1.15; color: var(--text); }
  .wert.gross .z { font-size: clamp(28px, 7vh, 96px); }
  #profil { grid-column: 1 / -1; background: var(--panel); border-radius: 10px; position: relative; }
  #profil canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hinweis { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 10; background: rgba(0,0,0,.6);
    padding: 4px 10px; border-radius: 6px; font-size: 14px; color: var(--gedimmt); pointer-events: none; }
  #hinweis:empty { display: none; }
  #ausfall { position: absolute; left: 0; right: 0; top: 0; z-index: 30; display: none; padding: 14px;
    background: rgba(182,35,36,.92); color: #fff; font-size: clamp(20px, 4vh, 40px); font-weight: 800;
    text-align: center; }
  #ausfall.an { display: block; }
  #ausfall small { display: block; font-size: .5em; font-weight: 500; }
  .wert .u { font-size: clamp(14px, 2.4vh, 28px); font-weight: 600; color: var(--gedimmt); white-space: nowrap; }
  #wKurbel b { color: var(--text); font-variant-numeric: tabular-nums; }
  #btnNeu { margin-left: 18px; position: relative; overflow: hidden; }
  #btnNeu .balken { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--rot); }
  #banner { position: absolute; inset: 0; z-index: 20; display: none; align-items: center;
    justify-content: center; font-size: 8vh; font-weight: 800; background: rgba(0,0,0,.45); }
  #banner.an { display: flex; }
  .leaflet-container { background: #222; }
  #leiste button.scharf { background: var(--gelb); color: #000; border-color: var(--gelb); }
  #edgeDlg { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); }
  #edgeDlg.an { display: flex; }
  #edgeDlg .box { background: var(--panel); border: 1px solid var(--rand); border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 14px; min-width: 340px; }
  #edgeDlg .box div { font-size: 18px; color: var(--gedimmt); }
  #edgeDlg input { font-size: 48px; padding: 8px 12px; width: 100%; border-radius: 10px; border: 1px solid var(--rand);
    background: var(--bg); color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  #edgeDlg .knoepfe { display: flex; gap: 12px; }
  #edgeDlg button { flex: 1; font-size: 24px; padding: 16px; border-radius: 10px; border: 1px solid var(--rand);
    background: var(--bg); color: var(--text); }
  #edgeDlg button.ok { background: var(--akzent); color: #000; border-color: var(--akzent); }
  /* Form: Kontroll-HF je Fahrt */
  #formDlg { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); }
  #formDlg.an { display: flex; }
  #formDlg .box { background: var(--panel); border: 1px solid var(--rand); border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 12px; width: min(720px, 94vw); max-height: 90vh; }
  #formTitel { font-size: 18px; color: var(--gedimmt); }
  #formTitel b { color: var(--text); font-size: 22px; }
  #formKurve { width: 100%; height: 240px; background: var(--bg); border-radius: 10px; }
  #formKurve text { fill: var(--gedimmt); font-size: 13px; }
  #formListe { width: 100%; border-collapse: collapse; font-size: 16px; font-variant-numeric: tabular-nums; }
  #formListe td { padding: 4px 8px; border-bottom: 1px solid var(--rand); }
  #formListe td.z { text-align: right; }
  #formDlg .tabelle { overflow-y: auto; }
  #formZu { font-size: 22px; padding: 12px; border-radius: 10px; border: 1px solid var(--rand);
    background: var(--bg); color: var(--text); }
  /* Coaching: Kachelfarben, Ansage, Infozeile */
  .wert.ok { background: #16361f; } .wert.warn { background: #3d2f0c; } .wert.alarm { background: #4a1416; }
  .wert .pfeil { font-size: .8em; margin-left: 8px; }
  /* Ansage als schmaler Streifen oben im Bild; die Leistungskachel zeigt die Warnung dauerhaft */
  #coach { position: absolute; left: 50%; top: 36px; transform: translateX(-50%); z-index: 25; display: none;
    padding: 3px 14px; border-radius: 8px; font-size: clamp(15px, 2.6vh, 26px); font-weight: 700;
    text-align: center; max-width: 80%; opacity: .85; pointer-events: none; }
  #coach.an { display: block; }
  #coach.rot { background: rgba(182,35,36,.8); color: #fff; } #coach.gelb { background: rgba(210,153,34,.95); color: #000; }
  #coach.blau { background: rgba(88,166,255,.95); color: #000; } #coach.gruen { background: rgba(63,185,80,.95); color: #000; }
  #coachInfo { position: absolute; left: 8px; bottom: 8px; z-index: 12; background: rgba(0,0,0,.65); padding: 4px 10px;
    border-radius: 6px; font-size: 14px; color: var(--text); pointer-events: none; }
  #coachInfo:empty { display: none; }
  /* Overlay (nur quer): Werte liegen über Street View bzw. der großen Karte, die Karte rechts wird breiter;
     Steigung oben links, Strecke/Fahrzeit oben rechts, die übrigen Werte als Leiste unten */
  @media (orientation: landscape) {
    body.overlay { grid-template-columns: 1fr minmax(200px, 24vw); }
    body.overlay:has(#kartenslot.leer) { grid-template-columns: 1fr; }
    body.overlay #haupt { grid-column: 1; grid-row: 2; }
    body.overlay #kartenslot { grid-column: 2; grid-row: 2; }
    body.overlay #seite { grid-column: 1; grid-row: 2; z-index: 15; pointer-events: none; }
    body.overlay #werte { padding: 8px; grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: auto 1fr auto; grid-template-areas: "st st . . km zeit" ". . . . . ." "watt tempo kad hf rest hm"; }
    body.overlay .wert { background: rgba(16,18,20,.72); padding: 2px 8px; }
    body.overlay .wert.ok { background: rgba(22,54,31,.85); } body.overlay .wert.warn { background: rgba(61,47,12,.88); }
    body.overlay .wert.alarm { background: rgba(140,25,28,.9); }
    body.overlay .wert .z { font-size: clamp(18px, 4.2vh, 52px); }
    body.overlay .wert.gross .z { font-size: clamp(28px, 7.5vh, 96px); }
    body.overlay .wert:nth-child(1) { grid-area: st; }   body.overlay .wert:nth-child(2) { grid-area: watt; }
    body.overlay .wert:nth-child(3) { grid-area: tempo; } body.overlay .wert:nth-child(4) { grid-area: kad; }
    body.overlay .wert:nth-child(5) { grid-area: hf; }   body.overlay .wert:nth-child(6) { grid-area: km; }
    body.overlay .wert:nth-child(7) { grid-area: zeit; } body.overlay .wert:nth-child(8) { grid-area: rest; }
    body.overlay .wert:nth-child(9) { grid-area: hm; }
    body.overlay .wert:nth-child(6) .z, body.overlay .wert:nth-child(7) .z { font-size: clamp(16px, 3.2vh, 36px); }
    /* Coach-Ansage und -Info über die Leiste, Hinweis oben mittig bleibt */
    body.overlay #coach { top: auto; bottom: calc(9vh + 64px); }
    body.overlay #coachInfo { bottom: calc(9vh + 30px); }
    /* große Karte: Knöpfe (◎, Ebenen) und Quellenangabe nicht unter den Kacheln */
    body.overlay #haupt .leaflet-top { top: calc(8vh + 44px); }
    body.overlay #haupt .leaflet-bottom { bottom: calc(5vh + 44px); }
  }
  @media (orientation: portrait) {
    body, body:has(#kartenslot.leer) { grid-template-columns: 35% 1fr; grid-template-rows: auto 40vh 1fr 18vh; }
    #haupt { grid-column: 1 / -1; }
    body:has(#kartenslot.leer) #seite { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="leiste">
  <select id="kurs" title="Strecke"></select>
  <button id="btnFav" title="Favorit (oben in der Liste, beim Aufräumen geschützt)">☆</button>

<script>
"use strict";
{ // eigener Block: keine globalen Namen, die mit Bluefys eingeschleustem Skript kollidieren
// ------------------------------------------------------------------ Konstanten
const UUID = n => `0000${n.toString(16).padStart(4, "0")}-0000-1000-8000-00805f9b34fb`;
const FTMS = UUID(0x1826), INDOOR_BIKE_DATA = UUID(0x2ad2), FTMS_STATUS = UUID(0x2ada);
const CPS = UUID(0x1818), CP_MESSUNG = UUID(0x2a63);
// Der Edge setzt das Kursprofil am Kickr rund 60 m später um als die gefahrene Distanz (gemessen 14.10.2026,
// Misaka-Pass: in allen Abschnitten +40…+100 m, meist +60 m). Alles Sichtbare (Street View, Karte, Profil,
// Steigung, Rampen, Coach) zeigt deshalb diese Stelle; „Strecke“ und das Protokoll bleiben die echte Distanz.
// Im Testmodus rechnet iRide selbst, dort kein Versatz.

// ------------------------------------------------------------------ Geometrie
const RAD = Math.PI / 180;
function abstand(a, b) {
  const dLat = (b.lat - a.lat) * RAD, dLon = (b.lon - a.lon) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
function kurswinkel(a, b) {
  const y = Math.sin((b.lon - a.lon) * RAD) * Math.cos(b.lat * RAD);
  const x = Math.cos(a.lat * RAD) * Math.sin(b.lat * RAD) -
            Math.sin(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.cos((b.lon - a.lon) * RAD);
  return (Math.atan2(y, x) / RAD + 360) % 360;
}
// Kürzeste Drehung von a nach b in Grad, −180 … 180. Doppeltes Modulo, weil % in JS das Vorzeichen behält:
// (soll − ist + 540) % 360 wird negativ, sobald soll − ist < −540 (Kartenpeilung 0…360, Sollwert −360…0)
const winkelDiff = (a, b) => ((b - a) % 360 + 540) % 360 - 180;

function gpxLesen(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  let knoten = [...doc.getElementsByTagName("trkpt")];
  if (!knoten.length) knoten = [...doc.getElementsByTagName("rtept")];
  const pts = [];
  for (const k of knoten) {
    const e = k.getElementsByTagName("ele")[0];
    const p = { lat: +k.getAttribute("lat"), lon: +k.getAttribute("lon"), ele: e ? +e.textContent : 0 };
    if (pts.length) {
      const s = abstand(pts[pts.length - 1], p);
      if (s < 0.01) continue;
      p.d = pts[pts.length - 1].d + s;
    } else p.d = 0;
    pts.push(p);
  }
  let hoch = 0;
  pts.forEach((p, i) => { if (i) hoch += Math.max(0, p.ele - pts[i - 1].ele); p.hoch = hoch; });
  const name = doc.getElementsByTagName("name")[0];
  // Künstliche Anfahrt (kickr_anstieg/kurs_katalog): flaches Stück mit exakt gleicher Höhe am Anfang
  let anfahrt = 0;
  for (const q of pts) { if (Math.abs(q.ele - pts[0].ele) > 0.05) break; anfahrt = q.d; }
  if (anfahrt < 500 || anfahrt > pts[pts.length - 1].d / 2) anfahrt = 0;   // kein echter Vorlauf
  return { pts, laenge: pts[pts.length - 1].d, hoch, anfahrt, name: name ? name.textContent : "" };
}

function index(d) {  // letzter Punkt mit p.d <= d
  const pts = z.kurs.pts;
  let lo = 0, hi = pts.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m].d <= d) lo = m; else hi = m; }
  return lo;
}
function punkt(d) {
  const pts = z.kurs.pts;
  d = Math.max(0, Math.min(z.kurs.laenge, d));
  const i = index(d), a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
  const f = b.d > a.d ? (d - a.d) / (b.d - a.d) : 0;
  return { lat: a.lat + f * (b.lat - a.lat), lon: a.lon + f * (b.lon - a.lon),
           ele: a.ele + f * (b.ele - a.ele), hoch: a.hoch + f * (b.hoch - a.hoch) };
}
function steigung(d) {
  const L = z.kurs.laenge;
  const a = Math.max(0, d - STEIGUNG_FENSTER), b = Math.min(L, d + STEIGUNG_FENSTER);
  return b > a ? (punkt(b).ele - punkt(a).ele) / (b - a) : 0;
}

function karteKurs() {

// ------------------------------------------------------------------ Höhenprofil
const leinwand = $("leinwand");
let profilBild = null;
const farbe = s => s < 0.02 ? "#3fb950" : s < 0.04 ? "#d29922" : s < 0.06 ? "#f0883e" : s < 0.08 ? "#f85149" : "#b62324";
const RAND = { l: 48, r: 12, o: 10, u: 22 };

// Ausschnitt in m (0 = ganze Strecke); 25 % hinter, 75 % vor der Position
const PROFIL_STUFEN = [1000, 2000, 5000, 0];
let profilStufe = 1;
try {
  const t = localStorage.getItem("iride.profilStufe"), g = t === null ? NaN : +t;
  if (g >= 0 && g < PROFIL_STUFEN.length) profilStufe = g;
} catch (e) {}
const UEBERSICHT = 16;   // px Höhe des Streifens mit der ganzen Strecke

function profilVorbereiten() {
  const r = window.devicePixelRatio || 1;
  const W = leinwand.clientWidth, H = leinwand.clientHeight;
  leinwand.width = W * r; leinwand.height = H * r;
  profilBild = (!z.kurs || W < 50 || H < 30) ? null : { W, H };
  $("btnProfil").textContent = PROFIL_STUFEN[profilStufe] ? `Profil ${PROFIL_STUFEN[profilStufe] / 1000} km` : "Profil ganz";
}

// Sichtbarer Bereich [von, bis] in m
function profilFenster() {
  const L_ = z.kurs.laenge, F = PROFIL_STUFEN[profilStufe];
  if (!F || F >= L_) return [0, L_];
  let von = pos() - F * 0.25;
  von = Math.max(0, Math.min(L_ - F, von));
  return [von, von + F];
}

function profilZeichnen() {
  const g = leinwand.getContext("2d"), r = window.devicePixelRatio || 1;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, leinwand.width, leinwand.height);
  if (!profilBild) return;
  g.scale(r, r);
  const { W, H } = profilBild, L_ = z.kurs.laenge;
  const [von, bis] = profilFenster(), ganz = von === 0 && bis === L_;
  const oben = ganz ? RAND.o : UEBERSICHT + 8;
  // ein Profil über die volle Breite (seit 21.11.2026; vorher rechts ein zweiter Ausschnitt der nächsten 2 km)
  const breite = W - RAND.l - RAND.r;
  profilBild.breite = breite;

  // Höhenbereich nur aus dem Ausschnitt, mindestens 30 m Spanne
  const n = Math.max(2, Math.round(breite / 3)), schritt = (bis - von) / n;
  let min = Infinity, max = -Infinity;
  for (let i = 0; i <= n; i++) { const e = punkt(von + i * schritt).ele; min = Math.min(min, e); max = Math.max(max, e); }
  const spanne = Math.max(30, max - min);
  min -= spanne * .08; max += spanne * .12;
  const x = d => RAND.l + (d - von) / (bis - von) * breite;
  const y = e => H - RAND.u - (e - min) / (max - min) * (H - oben - RAND.u);
  profilBild.x = x; profilBild.von = von; profilBild.bis = bis;

  // Fläche, eingefärbt nach Steigung
  for (let i = 0; i < n; i++) {
    const d1 = von + i * schritt, d2 = d1 + schritt, e1 = punkt(d1).ele, e2 = punkt(d2).ele;
    g.fillStyle = farbe((e2 - e1) / (d2 - d1));
    g.beginPath(); g.moveTo(x(d1), H - RAND.u); g.lineTo(x(d1), y(e1)); g.lineTo(x(d2) + .5, y(e2));
    g.lineTo(x(d2) + .5, H - RAND.u); g.closePath(); g.fill();
  }
  // Gefahrener Teil abgedunkelt
  const X = x(pos()), p = punkt(pos());
  g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(RAND.l, oben, Math.max(0, X - RAND.l), H - oben - RAND.u);

  // Achsen
  g.fillStyle = "#8b949e"; g.font = "13px -apple-system, Segoe UI, sans-serif";
  g.textAlign = "right"; g.textBaseline = "middle";
  const hs = (max - min) > 300 ? 100 : (max - min) > 120 ? 50 : (max - min) > 50 ? 20 : 10;
  for (let e = Math.ceil(min / hs) * hs; e <= max; e += hs) {
    g.fillText(e + " m", RAND.l - 6, y(e));
    g.strokeStyle = "rgba(255,255,255,.08)"; g.beginPath(); g.moveTo(RAND.l, y(e)); g.lineTo(W - RAND.r, y(e)); g.stroke();
  }
  g.textAlign = "center"; g.textBaseline = "top";
  const sp = bis - von, ks = sp > 20000 ? 5000 : sp > 8000 ? 2000 : sp > 3000 ? 1000 : sp > 1500 ? 500 : 200;
  for (let d = Math.ceil(von / ks) * ks; d <= bis; d += ks)
    g.fillText((d / 1000).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + " km", x(d), H - RAND.u + 4);

  // Position
  g.strokeStyle = "#fff"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(X, oben); g.lineTo(X, H - RAND.u); g.stroke();
  g.fillStyle = "#f85149"; g.beginPath(); g.arc(X, y(p.ele), 7, 0, 2 * Math.PI); g.fill();
  g.strokeStyle = "#fff"; g.stroke();
  g.fillStyle = "#eef1f4"; g.font = "bold 15px -apple-system, Segoe UI, sans-serif";
  const rechts = X > W / 2;
  g.textAlign = rechts ? "right" : "left"; g.textBaseline = "top";
  g.fillText(`${Math.round(p.ele)} m · ${zahl(z.dist / 1000, 2)} km`, X + (rechts ? -10 : 10), oben + 24);

  // Steigung je Abschnitt (500 m, bei großem Ausschnitt so weit wie die km-Achse) unten im Profil,
  // im Berg-Modus darüber die Zielwatt
  const abs = Math.max(500, ks);
  g.font = "bold 13px -apple-system, Segoe UI, sans-serif"; g.textAlign = "center"; g.textBaseline = "bottom";
  for (let d = Math.floor(von / abs) * abs; d < bis; d += abs) {
    const a = Math.max(von, d), b = Math.min(bis, d + abs);
    if (b - a < abs / 2 || x(b) - x(a) < 38) continue;
    const s = (punkt(b).ele - punkt(a).ele) / (b - a), xm = (x(a) + x(b)) / 2;
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(xm - 24, H - RAND.u - 20, 48, 18);
    g.fillStyle = "#eef1f4"; g.fillText(`${zahl(s * 100, 1)} %`, xm, H - RAND.u - 4);
    if (co.plan) {
      const zl = co.plan.ziel.slice(Math.floor(a / 100), Math.min(co.plan.ziel.length, Math.ceil(b / 100)));
      if (zl.length) { g.fillStyle = "#58a6ff"; g.fillText(`${Math.round(zl.reduce((u, v) => u + v, 0) / zl.length)} W`, xm, H - RAND.u - 24); }
    }
  }
  // Kopfzeile rechts: Gipfel oder Ziel
  const gi = z.kurs.gipfel, ziel = gi > pos() + 30 ? gi : L_;
  const rest = Math.max(0, ziel - pos()), hm = Math.max(0, punkt(ziel).ele - punkt(pos()).ele);
  g.fillStyle = "#eef1f4"; g.font = "bold 16px -apple-system, Segoe UI, sans-serif";
  g.textAlign = "right"; g.textBaseline = "top";
  g.fillText(`${ziel === gi ? "Gipfel" : "Ziel"} in ${zahl(rest / 1000, 1)} km · ${zahl(hm)} hm`, W - RAND.r, oben + 2);

  // Übersicht: ganze Strecke als Streifen, Ausschnitt markiert
  if (!ganz) {
    const ux = d => RAND.l + d / L_ * breite, uh = UEBERSICHT, un = Math.max(2, Math.round(breite / 4));
    let umin = Infinity, umax = -Infinity;
    for (let i = 0; i <= un; i++) { const e = punkt(i / un * L_).ele; umin = Math.min(umin, e); umax = Math.max(umax, e); }
    const uy = e => 2 + uh - (e - umin) / Math.max(1, umax - umin) * uh;
    g.fillStyle = "rgba(139,148,158,.45)"; g.beginPath(); g.moveTo(ux(0), uh + 2);
    for (let i = 0; i <= un; i++) { const d = i / un * L_; g.lineTo(ux(d), uy(punkt(d).ele)); }
    g.lineTo(ux(L_), uh + 2); g.closePath(); g.fill();
    g.strokeStyle = "#58a6ff"; g.lineWidth = 1.5; g.strokeRect(ux(von), 1, ux(bis) - ux(von), uh + 2);
    g.fillStyle = "#f85149"; g.fillRect(ux(pos()) - 1.5, 0, 3, uh + 4);
  }
  // Geist im Profil
  const gd = geistDist();
  if (gd != null && gd >= von && gd <= bis) {
    g.fillStyle = "#8b949e"; g.beginPath(); g.arc(x(gd), y(punkt(gd).ele), 6, 0, 2 * Math.PI); g.fill();
    g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.stroke();
  }
}

// Tippen aufs Profil setzt die Position (zum Abgleich mit dem Edge)
leinwand.addEventListener("click", e => {
  if (!profilBild || !profilBild.x) return;
  const rect = leinwand.getBoundingClientRect(), { W, von, bis } = profilBild;
  const d = von + (e.clientX - rect.left - RAND.l) / profilBild.breite * (bis - von);
  if (d < 0 || d > z.kurs.laenge) return;
  if (confirm(`Position auf ${(d / 1000).toFixed(2).replace(".", ",")} km setzen?`)) { z.dist = d; neuStart(); }
});

// ------------------------------------------------------------------ Anzeige
const zahl = (v, n = 0) => v.toLocaleString("de-DE", { minimumFractionDigits: n, maximumFractionDigits: n });
function zeit(s) {
  s = Math.floor(s);
  return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}
let letzteKarte = 0, letzterZoom = 0;
// Karte weich drehen statt springen: kürzester Weg, ease-in-out über DREH_MS, nur 20 Schritte pro Sekunde
// und nur solange gedreht wird (Akku). Eine neue Sollrichtung startet die Drehung ab der aktuellen Lage neu.
const DREH_MS = 900, DREH_SCHRITT_MS = 50;
let drehTimer = null;
function karteDrehen(soll) {
  const start = karte.getBearing(), delta = winkelDiff(start, soll), t0 = performance.now();
  clearInterval(drehTimer);
  drehTimer = setInterval(() => {
    const f = Math.min(1, (performance.now() - t0) / DREH_MS), e = f < .5 ? 2 * f * f : 1 - 2 * (1 - f) * (1 - f);
    karte.setBearing(start + delta * e);
    if (f >= 1) { clearInterval(drehTimer); drehTimer = null; }
  }, DREH_SCHRITT_MS);
}
function zeichnen(karteSofort = false) {
  if (!z.kurs) return;
  const p = punkt(pos()), s = steigung(pos());
  const frisch = Date.now() - z.datenZeit < VERALTET_MS;

  $("banner").classList.toggle("an", z.dist >= z.kurs.laenge - 1);

// ------------------------------------------------------------------ Geisterfahrer
// Letzte Fahrt auf diesem Kurs als Spur [[fahrzeit_s, dist_m], …]; Vergleich über die Fahrzeit (ab Kursstart)
function geistDist() {
  const g = z.geist;
  if (!g || !z.fahrzeit || !g.punkte.length) return null;
  const P = g.punkte, t = z.fahrzeit;
  if (t <= P[0][0]) return P[0][1];          // Spur beginnt später (z. B. nach Positionssprung): nicht rückwärts rechnen
  if (t >= P[P.length - 1][0]) return P[P.length - 1][1];
  let i = 1; while (i < P.length && P[i][0] < t) i++;
  const [t0, d0] = P[i - 1], [t1, d1] = P[i];
  return d0 + (d1 - d0) * (t - t0) / Math.max(1, t1 - t0);
}
function geistZeitBei(d) {   // Fahrzeit des Geists an Distanz d (null, wenn er dort nie war)
  const P = z.geist.punkte;
  if (!P.length || d > P[P.length - 1][1] || d < P[0][1]) return null;
  let i = 1; while (i < P.length && P[i][1] < d) i++;
  if (i >= P.length) return P[P.length - 1][0];
  const [t0, d0] = P[i - 1], [t1, d1] = P[i];
  return t0 + (t1 - t0) * (d - d0) / Math.max(1, d1 - d0);
}
function geistZeichnen(p) {
  const el = $("geist"), gd = geistDist();
  if (gd == null) { el.className = ""; geistM.remove(); return; }
  const q = punkt(gd); geistM.setLatLng([q.lat, q.lon]).addTo(karte);
  const tg = geistZeitBei(z.dist), dat = z.geist.datum.slice(8, 10) + "." + z.geist.datum.slice(5, 7) + ".";
  if (tg == null) { el.textContent = `Geist ${dat}: hier warst du nie`; el.className = "an"; return; }
  const delta = tg - z.fahrzeit, a = Math.abs(Math.round(delta));
  el.textContent = `Geist ${dat}: ${delta >= 0 ? "+" : "−"}${Math.floor(a / 60)}:${String(a % 60).padStart(2, "0")}`;
  el.className = "an " + (delta >= 0 ? "vor" : "hinter");
}
async function geistLaden() {
  z.geist = null;
  // ohne = laufende Fahrt: nach einem Neuladen wäre sonst ihr eigener erster Teil der Geist
  const ohne = fahrt ? "&ohne=" + encodeURIComponent(fahrt.id) : "";
  try { const g = await (await fetch("api/geist?kurs=" + encodeURIComponent(z.kursName) + ohne)).json(); if (g && g.punkte) z.geist = g; }
  catch (e) {}
}

// ------------------------------------------------------------------ Einblendungen
// Kehren (Richtungswechsel > 140° auf 80 m), Orte aus Wikipedia neben der Strecke, Landschaftstext aus dem
// Katalog zu Beginn, Gipfel. Immer nur eine Einblendung; Orte frühestens alle 45 s.
const EIN_MS = 7000, ORT_ABSTAND_S = 45, ORT_VORLAUF_M = 150, ORT_QUER_M = 1200;
const ein = { bis: 0, letzterOrt: -1e9, letztPos: null, text: false };
function einblenden(html, ms = EIN_MS) {
  $("einblendung").innerHTML = html; $("einblendung").classList.add("an");
  ein.bis = Date.now() + ms;
}
function kursAnalysieren() {
  const k = z.kurs, L_ = k.laenge;
  // Gipfel: höchster Punkt nach dem Vorlauf
  let gipfel = 0, hmax = -1e9;
  for (let d = k.anfahrt || 0; d <= L_; d += 20) { const h = punkt(d).ele; if (h > hmax) { hmax = h; gipfel = d; } }
  k.gipfel = gipfel;
  const kehren = [];
  for (let d = 40; d < L_ - 40; d += 10) {
    const w = Math.abs(winkelDiff(kurswinkel(punkt(d - 40), punkt(d)), kurswinkel(punkt(d), punkt(d + 40))));
    if (w > 140 && (!kehren.length || d - kehren[kehren.length - 1] > 120)) kehren.push(d);
  }
  k.kehren = kehren; k.orte = []; k.text = null;
  Object.assign(ein, { letztPos: null, text: false, gipfelGezeigt: false, anstiegT0: null, anstiegW: [0, 0] });
}
async function orteLaden() {
  const k = z.kurs, name = z.kursName, gefunden = new Map();
  for (let d = (k.anfahrt || 0); d <= k.laenge; d += 1500) {
    const p = punkt(d);
    for (const sprache of ["de", "en"]) {
      try {
        const url = `https://${sprache}.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${p.lat.toFixed(5)}|${p.lon.toFixed(5)}`
          + `&gsradius=1500&gslimit=15&format=json&origin=*`;
        const r = await (await fetch(url)).json(), treffer = (r.query && r.query.geosearch) || [];
        for (const o of treffer) if (!gefunden.has(o.title)) gefunden.set(o.title, o);
        if (treffer.length) break;   // Englisch nur, wo es an diesem Suchpunkt nichts Deutsches gibt
      } catch (e) {}
    }
    if (z.kursName !== name) return;   // Kurs gewechselt
  }
  const orte = [];
  for (const o of gefunden.values()) {
    // nächster Streckenpunkt (alle 25 m) und Seite
    let best = null;
    for (let d = (k.anfahrt || 0); d <= k.laenge; d += 25) {
      const p = punkt(d), a = abstand(p, { lat: o.lat, lon: o.lon });
      if (!best || a < best.a) best = { d, a };
    }
    if (!best || best.a > ORT_QUER_M) continue;
    const r = kurswinkel(punkt(best.d - 10), punkt(best.d + 10)), zu = kurswinkel(punkt(best.d), { lat: o.lat, lon: o.lon });
    const seite = best.a < 60 ? "an der Strecke" : ((zu - r + 360) % 360) < 180 ? "rechts" : "links";
    orte.push({ d: best.d, name: o.title, seite, quer: best.a });
  }
  k.orte = orte.sort((a, b) => a.d - b.d);
}
async function textLaden() {
  const kid = ((z.kursName || "").match(/^Katalog_(.+?)(?:_edge)?\.gpx$/) || [])[1];
  if (!kid) return;
  try { const s = await (await fetch("api/strecke?id=" + encodeURIComponent(kid))).json(); if (s) z.kurs.text = s; } catch (e) {}
}
function ereignisse() {
  const el = $("einblendung"), d = pos(), alt = ein.letztPos, k = z.kurs;
  if (Date.now() > ein.bis) el.classList.remove("an");
  ein.letztPos = d;
  if (alt == null || !z.fahrzeit) return;
  const vorbei = x => alt < x && x <= d;
  // Gipfel: Anstiegszeit (ab Ende des Vorlaufs) und Vergleich mit der letzten Fahrt
  if (vorbei(k.anfahrt || 0) || (ein.anstiegT0 == null && d > (k.anfahrt || 0) && d < k.gipfel)) ein.anstiegT0 ??= z.fahrzeit;
  if (!ein.gipfelGezeigt && vorbei(k.gipfel) && ein.anstiegT0 != null) {
    ein.gipfelGezeigt = true;
    const t = Math.round(z.fahrzeit - ein.anstiegT0), w = fahrt && fahrt.anstiegW[1] ? Math.round(fahrt.anstiegW[0] / fahrt.anstiegW[1]) : null;
    if (fahrt) { fahrt.anstieg = t; fahrt.anstiegW_ = w; }
    const fr = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    const vor = nutzer.historie.filter(f => f.kurs === z.kursName && f.anstieg && (!fahrt || f.id !== fahrt.id));
    const best = vor.length ? vor.reduce((a, b) => b.anstieg < a.anstieg ? b : a) : null;
    const vergleich = best ? (t <= best.anstieg ? `${fr(best.anstieg - t)} schneller als dein Bestwert vom ${best.datum.slice(8, 10)}.${best.datum.slice(5, 7)}.`
                                                : `${fr(t - best.anstieg)} hinter deinem Bestwert vom ${best.datum.slice(8, 10)}.${best.datum.slice(5, 7)}.`) : "erste Fahrt hier";
    $("gipfel").innerHTML = `<b>Gipfel</b><span>${fr(t)}${w ? ` · Ø ${w} W` : ""}</span><small>${vergleich}</small>`;
    $("gipfel").classList.add("an"); setTimeout(() => $("gipfel").classList.remove("an"), 15000);
    if (fahrt) fahrtSenden();
    return;
  }
  // Landschaft einmal zu Beginn
  if (!ein.text && k.text && k.text.text && (k.text.text.szenerie || k.text.text.bekannt)) {
    ein.text = true;
    const s = k.text.text.szenerie || "", b = k.text.text.bekannt;
    einblenden(`${esc(s.length > 170 ? s.slice(0, 167) + " …" : s)}${b ? `<small>bekannt aus: ${esc(b)}</small>` : ""}`, 15000);
    return;
  }
  const i = k.kehren.findIndex(vorbei);
  if (i >= 0) { einblenden(`Kehre ${i + 1} von ${k.kehren.length}`, 5000); return; }
  if (Date.now() < ein.bis || (z.fahrzeit - ein.letzterOrt) < ORT_ABSTAND_S) return;
  const o = k.orte.find(o => !o.gezeigt && d >= o.d - ORT_VORLAUF_M && d < o.d + 50);
  if (o) {
    o.gezeigt = true; ein.letzterOrt = z.fahrzeit;
    einblenden(`📍 ${esc(o.name)}<small>${o.seite}${o.seite === "an der Strecke" ? "" : `, ${Math.round(o.quer / 50) * 50} m`}</small>`);
  }
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ------------------------------------------------------------------ Takt
let letzterTakt = performance.now(), letztesSpeichern = 0, letztesProtokoll = 0, letztesZeichnen = 0, letztesKurbelProtokoll = 0;
// Positionszeile im Protokoll alle 2 s (vorher 10 s): genau genug für den Abgleich mit der Edge-FIT (1 s)
const PROTOKOLL_MS = 2000;
function takt() {
  const jetzt = performance.now(), dt = Math.min(2, (jetzt - letzterTakt) / 1000);
  letzterTakt = jetzt;
  const raffer = z.sim ? z.simRaffer : 1;
  if (z.sim && z.kurs) {
    z.tempo = simTempo(z.simWatt, steigung(z.dist)) * 3.6;
    z.watt = z.simWatt; z.datenZeit = Date.now();
    simKoerper(dt * raffer);
  }
  const frisch = Date.now() - z.datenZeit < VERALTET_MS;
  if (z.scharf && frisch && z.tempo > 2) scharfAusloesen();
  if (z.kurs && !z.scharf && frisch && z.tempo > 0.5 && z.dist < z.kurs.laenge) {
    // Sendet der Kickr seine Gesamtdistanz, kommt der Weg von dort (indoorBikeData), sonst integrieren
    // (bleibt das Distanzfeld länger als 5 s aus, wieder integrieren, sonst stünde die Position)
    if (z.sim || !z.kickrDistDa || Date.now() - z.kickrDistZeit > 5000)
      z.dist = Math.min(z.kurs.laenge, z.dist + z.tempo / 3.6 * dt * raffer);
    z.fahrzeit += dt * raffer;
    coachTakt(dt * raffer);
    fahrtTakt(dt);
  }
  if (fahrt && Date.now() - fahrt.gesendet > FAHRT_SENDEN_MS) fahrtSenden();
  kickrWache();
  if (Date.now() - letztesProtokoll > PROTOKOLL_MS && z.kurs && !z.scharf && frisch) {
    letztesProtokoll = Date.now();
    protokoll(`pos dist=${z.dist.toFixed(0)} zeit=${z.fahrzeit.toFixed(0)} v=${(z.tempo || 0).toFixed(1)}`
        + ` w=${z.watt ?? ""} quelle=${z.kickrDistDa ? "kickr" : "integriert"}`
        + ` hf=${Date.now() - z.hfZeit < VERALTET_MS ? z.hf : ""} kad=${z.kadenz == null ? "" : Math.round(z.kadenz)}`
        + ` s=${(steigung(z.dist) * 100).toFixed(1)} sv=${sv.zahl} svg=${sv.gegen}` + coachProtokoll());
  }
  if (kurbelGeraet && kurbelGeraet.gatt.connected && Date.now() - letztesKurbelProtokoll >= 1000) {
    letztesKurbelProtokoll = Date.now(); kurbelProtokoll();
  }
  if (Date.now() - letztesZeichnen >= ANZEIGE_MS) { letztesZeichnen = Date.now(); zeichnen(); }
  streetView();
  if (Date.now() - letztesSpeichern > 2000) { letztesSpeichern = Date.now(); speichern(); }
}

// Testmodus: Tempo aus Leistung, Steigung und Systemmasse (stationäre Fahrt)
function simTempo(P, s) {
  const m = z.masse, g = 9.81, crr = 0.005, cdA = 0.35, rho = 1.2, eta = 0.97;
  const th = Math.atan(s), F = m * g * (Math.sin(th) + crr * Math.cos(th));
  let lo = 0, hi = 30;
  for (let i = 0; i < 50; i++) {
    const v = (lo + hi) / 2;
    if (v * (F + 0.5 * rho * cdA * v * v) > P * eta) hi = v; else lo = v;
  }
  return lo;
}

// ------------------------------------------------------------------ Speichern
function speichern() {
  // fahrt mit: nach einem Neuladen (Bluefy-Absturz, Akku) geht dieselbe Fahrt weiter statt einer zweiten
  try { localStorage.setItem("kickrAnzeige", JSON.stringify({ kurs: z.kursName, dist: z.dist, fahrzeit: z.fahrzeit, fahrt })); }
  catch (e) { /* privater Modus */ }
}
function gespeichert() {

}

// ------------------------------------------------------------------ Historie und Favoriten
// Eine Fahrt beginnt mit dem ersten Meter auf einem Kurs und endet mit Kurswechsel, Zurücksetzen oder
// Schließen der Seite. Der Server bekommt minütlich den Zwischenstand (gleiche id ersetzt), damit ein
// leerer iPad-Akku die Fahrt nicht verliert. Testmodus zählt nicht.
const FAHRT_MIN_S = 300;        // kürzere Fahrten nicht eintragen (Ausprobieren, Fehlstart)
const FAHRT_SENDEN_MS = 60000;
let fahrt = null, nutzer = { favoriten: [], historie: [] };
// Schlüssel einer Strecke: Katalog-id (wie im Katalog), sonst der Dateiname
const schluessel = datei => ((datei || "").match(/^Katalog_(.+?)(?:_edge)?\.gpx$/) || [])[1] || datei;

function fahrtTakt(dt) {
  if (z.sim) return;
  if (!fahrt) fahrt = { id: new Date().toISOString(), kurs: z.kursName, name: z.kurs.name || z.kursName,
                        datum: lokalZeit(), zeit: 0, weg: 0, letzt: z.dist, gesendet: Date.now(),
                        w: [0, 0], hf: [0, 0], kad: [0, 0], spur: [], anstiegW: [0, 0], anstieg: null, anstiegW_: null };
  const d = z.dist - fahrt.letzt;
  if (d > 0 && d < 50) fahrt.weg += d;     // +100-m-Knopf und Positionssprünge nicht mitzählen
  fahrt.letzt = z.dist; fahrt.zeit += dt;
  // Leistung mit Nullen (Rollen zählt, wie bei Garmin), HF und Kadenz ohne
  const summe = (s, x, mitNull = false) => { if (x != null && (mitNull ? x >= 0 : x > 0)) { s[0] += x * dt; s[1] += dt; } };
  summe(fahrt.w, z.watt, true);
  summe(fahrt.hf, Date.now() - z.hfZeit < VERALTET_MS ? z.hf : null);
  summe(fahrt.kad, z.kadenz);
  if (z.dist >= (z.kurs.anfahrt || 0) && z.dist < (z.kurs.gipfel || z.kurs.laenge)) summe(fahrt.anstiegW, z.watt, true);
  const sp = fahrt.spur;   // Spur für den Geisterfahrer alle 10 s Fahrzeit
  if (!sp.length || z.fahrzeit - sp[sp.length - 1][0] >= 10) sp.push([Math.round(z.fahrzeit), Math.round(z.dist)]);
}
function lokalZeit() {   // "2026-10-22T17:05:00" in Ortszeit, sortiert wie ISO
  const t = new Date(), p = n => String(n).padStart(2, "0");
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}T${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`;
}
function fahrtSenden(schliessen = false) {
  if (!fahrt) return;
  fahrt.gesendet = Date.now();
  if (fahrt.zeit < FAHRT_MIN_S) return;
  const m = s => s[1] ? Math.round(s[0] / s[1]) : null;
  const eintrag = { id: fahrt.id, kurs: fahrt.kurs, name: fahrt.name, datum: fahrt.datum,
    fahrzeit: Math.round(fahrt.zeit), km: +(fahrt.weg / 1000).toFixed(2),
    anteil: +(z.kurs ? Math.min(1, z.dist / z.kurs.laenge) : 0).toFixed(3),
    w: m(fahrt.w), hf: m(fahrt.hf), kad: m(fahrt.kad), ziel: !!z.kurs && z.dist >= z.kurs.laenge - 1,
    anstieg: fahrt.anstieg, anstieg_w: fahrt.anstiegW_ };
  if (fahrt.tf) Object.assign(eintrag, { tf_hf: fahrt.tf.hf, tf_w: fahrt.tf.w, tf_n: fahrt.tf.n });
  const text = JSON.stringify(eintrag);
  if (schliessen && navigator.sendBeacon) navigator.sendBeacon("api/historie", text);
  else fetch("api/historie", { method: "POST", body: text, keepalive: true }).catch(() => {});
  nutzer.historie = nutzer.historie.filter(f => f.id !== eintrag.id).concat(eintrag);
  const spur = JSON.stringify({ id: fahrt.id, kurs: fahrt.kurs, punkte: fahrt.spur });
  if (schliessen && navigator.sendBeacon) navigator.sendBeacon("api/spur", spur);
  else fetch("api/spur", { method: "POST", body: spur, keepalive: spur.length < 60000 }).catch(() => {});
}
function fahrtEnde() { fahrtSenden(); fahrt = null; }
addEventListener("pagehide", () => fahrtSenden(true));

// ------------------------------------------------------------------ Strecken
let kurseAlle = [];
// Favoriten oben (★), dahinter alphabetisch; gefahrene Strecken mit Anzahl
function kurseListe() {
  const fav = new Set(nutzer.favoriten), gefahren = {};
  for (const f of nutzer.historie) gefahren[schluessel(f.kurs)] = (gefahren[schluessel(f.kurs)] || 0) + 1;
  const sortiert = [...kurseAlle].sort((a, b) =>
    fav.has(schluessel(b.datei)) - fav.has(schluessel(a.datei)) || a.name.localeCompare(b.name, "de"));
  const sel = $("kurs"), wert = sel.value;

}

(() => {

// Steilstes 100-m-Stück in den nächsten 500 m, z. B. "max 8,4 % in 230 m"
function rampeSuchen(weite = 500) {   // {grad, weg} des steilsten 100-m-Stücks, das in weite m beginnt, oder null
  const L_ = z.kurs.laenge, bis = Math.min(L_ - 100, pos() + weite);
  let best = -Infinity, wo = null;
  for (let d = pos(); d <= bis; d += 25) {
    const g = (punkt(d + 100).ele - punkt(d).ele) / 100;
    if (g > best) { best = g; wo = d; }
  }
  return wo == null ? null : { grad: best, weg: wo - pos() };
}
function rampeVoraus() {
  if (!z.kurs) return "";
  const r = rampeSuchen();
  if (!r) return "";
  const best = r.grad, jetzt = steigung(pos()), weg = Math.round(r.weg / 10) * 10;
  if (best < 0.02 && jetzt < 0.02) return "nächste 500 m flach";
  if (weg < 30 || best - jetzt < 0.01) return `nächste 500 m max ${zahl(best * 100, 1)} %`;
  return `max ${zahl(best * 100, 1)} % in ${weg} m`;
}

// Form: Kontroll-HF je Fahrt (Historie-Felder tf_hf/tf_w/tf_n aus dem Tagesform-Check), Verlauf mit
// gleitendem Mittel über FORM_MITTEL Fahrten; gestrichelt die Referenz aus COACHING (ref_hf)
const FORM_MITTEL = 5;
$("btnForm").onclick = async () => {

$("formZu").onclick = () => $("formDlg").classList.remove("an");
function formZeigen() {
  const f = nutzer.historie.filter(x => x.tf_hf != null).sort((a, b) => (a.datum < b.datum ? -1 : 1));
  const ref = co.cfg && co.cfg.ref_hf, svg = $("formKurve");
  const tag = d => `${d.slice(8, 10)}.${d.slice(5, 7)}.`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  if (!f.length) {
    $("formTitel").textContent = "Noch keine Kontroll-HF gespeichert. Der Tagesform-Check läuft mit Coach an, "
      + `Minute ${COACH.tf_ab / 60}–${COACH.tf_bis / 60} im Flachen bei ~${co.cfg ? co.cfg.ref_watt : "?"} W.`;
    svg.innerHTML = ""; $("formListe").innerHTML = "";
    return;
  }
  const mittelN = f.map((_, i) => {
    const s = f.slice(Math.max(0, i - FORM_MITTEL + 1), i + 1);
    return s.reduce((a, x) => a + x.tf_hf, 0) / s.length;
  });
  const letzte = f[f.length - 1];
  $("formTitel").innerHTML = `Kontroll-HF zuletzt <b>${zahl(letzte.tf_hf, 1)} bpm</b> bei ${letzte.tf_w} W`
    + ` · Ø letzte ${Math.min(FORM_MITTEL, f.length)} Fahrten <b>${zahl(mittelN[f.length - 1], 1)}</b>`
    + (ref ? ` · Referenz ${ref}` : "") + ` · ${f.length} Fahrten`;

  // Kurve: x nach Datum, y in bpm (niedriger = besser)
  const W = 640, H = 240, L = 40, R = 12, O = 12, U = 24;
  const t = f.map(x => Date.parse(x.datum)), t0 = t[0], t1 = t[t.length - 1];
  const werte = f.map(x => x.tf_hf).concat(ref ? [ref] : []);
  const yMin = Math.floor((Math.min(...werte) - 3) / 5) * 5, yMax = Math.ceil((Math.max(...werte) + 3) / 5) * 5;
  const X = v => (t1 > t0 ? L + (v - t0) / (t1 - t0) * (W - L - R) : (L + W - R) / 2);
  const Y = v => O + (yMax - v) / (yMax - yMin) * (H - O - U);
  let s = "";
  for (let v = yMin; v <= yMax; v += 5)
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--rand)"/>`
      + `<text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  if (ref) s += `<line x1="${L}" x2="${W - R}" y1="${Y(ref)}" y2="${Y(ref)}" style="stroke:var(--gedimmt)" stroke-dasharray="6 5"/>`;
  s += `<text x="${W - R}" y="${O + 12}" text-anchor="end">niedriger = besser</text>`;
  const linie = ys => ys.map((y, i) => `${X(t[i]).toFixed(1)},${Y(y).toFixed(1)}`).join(" ");
  s += `<polyline points="${linie(f.map(x => x.tf_hf))}" fill="none" style="stroke:var(--gedimmt)" stroke-width="1.5"/>`;
  if (f.length > 1) s += `<polyline points="${linie(mittelN)}" fill="none" style="stroke:var(--akzent)" stroke-width="3"/>`;
  s += f.map((x, i) => `<circle cx="${X(t[i])}" cy="${Y(x.tf_hf)}" r="4" style="fill:var(--text)"/>`).join("");
  s += `<text x="${L}" y="${H - 6}">${tag(f[0].datum)}</text>`;
  if (f.length > 1) s += `<text x="${W - R}" y="${H - 6}" text-anchor="end">${tag(letzte.datum)}</text>`;
  svg.innerHTML = s;

  $("formListe").innerHTML = f.slice().reverse().map(x =>
    `<tr><td>${tag(x.datum)}${x.datum.slice(2, 4)}</td><td>${esc(x.name || x.kurs)}</td>`
    + `<td class="z">${zahl(x.tf_hf, 1)} bpm</td><td class="z">${x.tf_w} W</td>`
    + `<td class="z">${ref ? (x.tf_hf >= ref ? "+" : "−") + zahl(Math.abs(x.tf_hf - ref), 1) : ""}</td>`
    + `<td class="z">${x.tf_n} s</td></tr>`).join("");
}

// Testmodus: HF und Kadenz grob nachbilden, damit der Coach etwas zu tun hat.
// HF folgt linear der Leistung mit 45 s Zeitkonstante und leichter Drift; Kadenz aus Tempo und Gang
// (36 × 11–32), geschaltet wird mit Verzug.
const SIM_KETTENBLATT = 36, SIM_RITZEL = [11, 12, 13, 14, 15, 17, 19, 21, 24, 28, 32];
const sim = { hf: 70, gang: 6, schalt: 0, uhr: 0 };
function simKoerper(dt) {
  sim.uhr += dt;
  const v = (z.tempo || 0) / 3.6;
  const kad = () => v * 60 / (RADUMFANG * SIM_KETTENBLATT / SIM_RITZEL[sim.gang]);
  if (sim.uhr - sim.schalt > 8) {
    if (kad() < 75 && sim.gang < SIM_RITZEL.length - 1) { sim.gang++; sim.schalt = sim.uhr; }
    else if (kad() > 95 && sim.gang > 0) { sim.gang--; sim.schalt = sim.uhr; }
  }
  z.kadenz = v > 0.3 ? kad() : 0;
  if (z.hfQuelle !== "gurt") {
    const ziel = 60 + 0.5 * z.watt + z.simHfPlus + 6 * z.fahrzeit / 3600;
    sim.hf += (ziel - sim.hf) * (1 - Math.exp(-dt / 45));
    z.hf = Math.round(sim.hf); z.hfZeit = Date.now(); z.hfQuelle = "sim";
  }
}

// ------------------------------------------------------------------ Coaching
// Hilft, Leistung und HF selbst zu regeln: geführt wird nach Leistung, die HF ist Leitplanke.
// Ziele aus lokal.py (COACHING) über /api/config; dort lässt sich jeder Parameter hier überschreiben.
// Uhr ist die Fahrzeit (im Testmodus mit Zeitraffer), Proben im Sekundentakt.
const COACH = {
  abstand: 25,          // s Mindestabstand zwischen zwei Ansagen
  wiederholen: 45,      // s, bis dieselbe Dauer-Ansage (HF, Leistung, Kadenz) wiederkommt
  anlauf: 60,           // s nach dem Losfahren ohne Band-Ansagen (Überziehen zählt trotzdem)
  hf_fenster: 90,       // s für den HF-Trend (lineare Regression)
  hf_vorschau: 2,       // min: Warnung, wenn HF + Trend × 2 min über die Decke läuft …
  hf_trend_nah: 12,     // … und die HF höchstens so weit unter der Decke ist (Anstieg aus der Ruhe ist normal)
  hf_hysterese: 3,      // bpm unter der Decke, bis die HF-Warnung endet
  band_hysterese: 3,    // W über/unter dem Band (Ø 30 s), bis es als verlassen gilt
  ueberzieh: 20,        // W über dem Band (Ø 3 s) …
  ueberzieh_dauer: 10,  // … so viele s: sofort „ruhiger“ (Überziehen am Rampeneinstieg)
  kad_dauer: 10,        // s Kadenz unter der Grenze …
  kad_steigung: 0.03,   // … bei mindestens dieser Steigung
  kad_nachlass: 180,    // s Wiederholabstand ab der dritten Kadenz-Ansage in Folge (kein Gang mehr?)
  rampe_ab: 0.04,       // Rampe: steilstes 100-m-Stück voraus mindestens so steil,
  rampe_delta: 0.02,    // mindestens 2 Punkte steiler als jetzt
  rampe_weg: 150,       // und beginnt in höchstens so vielen m
  nachlass_delta: 0.025, // Steigung 2,5 Punkte flacher als 100 m zuvor
  gut_nach: 120, gut_wieder: 300,   // s im Band bis „gut so“, danach alle 5 min
  tf_ab: 240, tf_bis: 600,  // s Fahrzeit: Fenster des Tagesform-Checks
  tf_fenster: 20,       // W um die Referenzleistung (Ø 30 s), Steigung unter 2 %
  tf_proben: 60,        // gültige Sekunden mindestens
  tf_toleranz: 8,       // bpm über der Referenz: Ziele für heute senken
  tf_senkung: 10,       // W, um die das Band dann sinkt
  hf_pro_watt: 0.3,     // bpm je W, um auf die Referenzleistung umzurechnen (vorläufig)
};
const co = { cfg: null, an: false, ton: false, modus: "grundlage", bergW: 160 };

// ------------------------------------------------------------------ Berg-Modus
// Ziel je 100 m aus dem Profil: Grundleistung × (1 + k × (Steigung − Ø Steigung)), höchstens ±spanne, nie unter der
// Leistung für kad_min im leichtesten Gang (COACHING.gang). Vorlauf = Einfahren, nach dem Gipfel = Ausfahren,
// letzter km davor = Schluss: alles, was das W′-Budget noch hergibt. W′-Bilanz nach Skiba (Verbrauch über CP,
// Erholung darunter anteilig zum Fehlenden), CP = COACHING.ftp, W′ = COACHING.w_prime (J). Der Plan wird vorab
// durchgerechnet; reicht das Budget nicht bis zum Schluss, sinkt die Grundleistung in 5-W-Schritten.
const BERG = {
  k: 0.03,             // je Prozentpunkt über/unter Ø 3 % mehr/weniger Leistung
  spanne: 0.15,        // höchstens ±15 % um die Grundleistung
  einfahren: 0.75, ausfahren: 0.6,   // Anteil der Grundleistung
  schluss_m: 1000,     // letzter Abschnitt vor dem Gipfel: alles raus
  reserve: 0.25,       // W′-Rest, unter dem das Ziel bis zur Erholung knapp unter CP bleibt
  plan_reserve: 0.3,   // so viel W′ soll der Plan beim Schluss noch übrig haben
  band: 15,            // ± W um das Ziel (Mittel der letzten 30 s, das Ziel springt alle 100 m)
  knapp: 0.5,          // „ruhiger“ nur, wenn W′ darunter liegt: wer Reserve hat, darf mehr fahren (22.10.)
  kad_min: 60,         // rpm im leichtesten Gang als Untergrenze
  max_faktor: 1.6,     // Schluss höchstens 1,6 × CP
  vorschau_m: 1500, vorschau_min: 250,   // steiles Stück voraus: so weit schauen, frühestens ab so viel m ansagen
  vorschau_delta: 15, vorschau_laenge: 300,   // mindestens 15 W mehr, mindestens 300 m lang
};
const W_LISTE = Array.from({ length: 21 }, (_, i) => 120 + 5 * i);   // Auswahl Grundleistung 120–220 W

function leistungBei(v, s) {   // W für Tempo v (m/s) bei Steigung s, gleiches Modell wie simTempo
  const m = z.masse, th = Math.atan(s), F = m * 9.81 * (Math.sin(th) + 0.005 * Math.cos(th));
  return v * (F + 0.5 * 1.2 * 0.35 * v * v) / 0.97;
}
function gangW(s) {
  const g = co.cfg && co.cfg.gang;
  return g && g[0] > 0 && g[1] > 0 ? leistungBei(BERG.kad_min / 60 * RADUMFANG * g[0] / g[1], s) : 0;
}
function wbalSchritt(wbal, p, dt) {
  const cp = co.cfg.ftp, w0 = co.cfg.w_prime;
  return p > cp ? wbal - (p - cp) * dt : wbal + (cp - p) * (w0 - wbal) / w0 * dt;
}

function bergPlan() {
  co.plan = null;
  if (co.modus !== "berg" || !z.kurs || !(co.cfg && co.cfg.ftp > 0 && co.cfg.w_prime > 0)) return;
  const L = z.kurs.laenge, n = Math.ceil(L / 100), ele = d => punkt(d).ele, g = [];
  for (let i = 0; i < n; i++) { const a = i * 100, b = Math.min(L, a + 100); g.push(b > a ? (ele(b) - ele(a)) / (b - a) : 0); }
  const gs = g.map((_, i) => (g[Math.max(0, i - 1)] + g[i] + g[Math.min(n - 1, i + 1)]) / 3);   // über 300 m
  let gipfel = 0, hmax = -1e9;
  for (let d = 0; d <= L; d += 50) { const h = ele(d); if (h > hmax) { hmax = h; gipfel = d; } }
  const anf = z.kurs.anfahrt || 0;
  const art = gs.map((_, i) => i * 100 < anf ? "ein" : i * 100 >= gipfel ? "aus"
    : i * 100 >= gipfel - BERG.schluss_m ? "schluss" : "berg");
  const berg = gs.filter((_, i) => art[i] === "berg" || art[i] === "schluss");
  const gm = berg.length ? berg.reduce((a, b) => a + b, 0) / berg.length : 0;
  const ziele = p0 => gs.map((s, i) => art[i] === "ein" ? p0 * BERG.einfahren : art[i] === "aus" ? p0 * BERG.ausfahren
    : Math.max(gangW(s), p0 * Math.min(1 + BERG.spanne, Math.max(1 - BERG.spanne, 1 + BERG.k * 100 * (s - gm)))));
  // Budget bis zum Schluss durchrechnen; reicht es nicht, Grundleistung senken
  let p0 = co.bergW - (co.bergSenkung || 0), ziel;
  for (;; p0 -= 5) {      // mindestens einmal rechnen; bei 80 W Schluss, p0 passt dann zu ziel
    ziel = ziele(p0);
    let wbal = co.cfg.w_prime, ok = true;
    for (let i = 0; i < n && art[i] !== "schluss" && art[i] !== "aus"; i++) {
      wbal = wbalSchritt(wbal, ziel[i], 100 / Math.max(0.5, simTempo(ziel[i], gs[i])));
      if (wbal < BERG.plan_reserve * co.cfg.w_prime) { ok = false; break; }
    }
    if (ok || p0 - 5 < 80) break;
  }

}

function bergIndex() { return Math.min(co.plan.ziel.length - 1, Math.max(0, Math.floor(pos() / 100))); }
function bergZiel() {
  const pl = co.plan, i = bergIndex(), cp = co.cfg.ftp;
  if (pl.art[i] === "schluss") {
    // höchste Leistung, deren Verbrauch über CP bis zum Gipfel in den W′-Rest passt
    const rest = Math.max(50, pl.gipfel - pos()), s = (punkt(pl.gipfel).ele - punkt(pos()).ele) / rest;
    let p = cp;
    for (let q = cp; q <= cp * BERG.max_faktor; q += 5) {
      if ((q - cp) * rest / Math.max(0.5, simTempo(q, s)) <= Math.max(0, co.wbal)) p = q; else break;
    }
    // beim Eintritt festlegen, danach nur noch senken (sonst lief es gegen Ende um ~30 % hoch, 22.10.)
    p = Math.round(Math.max(p, pl.ziel[i]));
    co.schlussZiel = Math.min(co.schlussZiel ?? p, p);
    return co.schlussZiel;
  }
  let p = pl.ziel[i];
  if (pl.art[i] === "berg" && co.wbal < BERG.reserve * co.cfg.w_prime) p = Math.max(gangW(pl.gs[i]), Math.min(p, cp - 10));
  return Math.round(p);
}
// Nächstes Stück voraus, das mindestens vorschau_delta W mehr verlangt und vorschau_laenge m lang ist
function bergVorschau() {
  const pl = co.plan, i = bergIndex(), jetzt = pl.ziel[i], n = pl.ziel.length;
  const von = Math.ceil((pos() + BERG.vorschau_min) / 100), bis = Math.min(n - 1, Math.floor((pos() + BERG.vorschau_m) / 100));
  for (let j = von; j <= bis; j++) {
    if (pl.art[j] !== "berg" || pl.ziel[j] < jetzt + BERG.vorschau_delta) continue;
    let k = j; while (k + 1 < n && pl.art[k + 1] === "berg" && pl.ziel[k + 1] >= jetzt + BERG.vorschau_delta) k++;
    const laenge = (k - j + 1) * 100;
    if (laenge < BERG.vorschau_laenge) { j = k; continue; }
    const teil = pl.ziel.slice(j, k + 1), sg = pl.gs.slice(j, k + 1);
    return { bei: j * 100, weg: j * 100 - pos(), laenge, ziel: Math.round(teil.reduce((a, b) => a + b, 0) / teil.length),
             grad: sg.reduce((a, b) => a + b, 0) / sg.length, jetzt };
  }
  return null;
}
function bergKnoepfe() {
  const berg = co.modus === "berg";
  $("btnModus").textContent = berg ? "Berg" : "Grundlage";
  $("btnModus").classList.toggle("an", berg);
  $("btnModus").disabled = !co.cfg;
  $("bergW").style.display = berg ? "" : "none";
  $("bergW").value = co.bergW;
}
$("bergW").replaceChildren(...W_LISTE.map(w => new Option(`${w} W`, w)));
$("btnModus").onclick = () => {

  co.modus = co.modus === "berg" ? "grundlage" : "berg";

$("bergW").onchange = e => { co.bergW = +e.target.value; bergPlan(); coachKnoepfe(); };

function coachReset() {
  const c = co.cfg || {};
  Object.assign(co, {
    uhr: 0, naechste: 0, proben: [],
    wbal: c.w_prime || 0, bergSenkung: 0, schlussGesagt: false, schlussZiel: null, budgetGesagt: false, vorschauBis: -1e9, ziel: null,
    wMin: c.watt_min, wMax: c.watt_max, decke: co.modus === "berg" && c.hf_decke_berg ? c.hf_decke_berg : c.hf_decke,
    kadMin: co.modus === "berg" ? BERG.kad_min : c.kadenz_min,   // am Berg reicht der leichteste Gang nicht für mehr
    hfAlarm: false, band: "drin", ueberSeit: null, kadSeit: null, kadSerie: 0, bandSeit: null, gutLetzt: -1e9,
    letzteAnsage: -1e9, letzte: {}, rampeBei: -1e9, nachlassBei: -1e9,
    tf: { status: c.ref_watt && c.ref_hf ? "wartet" : "aus", werte: [], delta: null, melden: null },
    text: "", art: "", bis: 0, p3: null, p30: null, hf: null, trend: null,
  });
  bergPlan();
}
coachReset();

function coachKonfigurieren(c) {
  const noetig = ["watt_min", "watt_max", "hf_decke", "kadenz_min"];
  if (!c || noetig.some(k => !(c[k] > 0))) { co.cfg = null; coachKnoepfe(); return; }
  for (const k of Object.keys(c)) if (k in COACH && typeof c[k] === "number") COACH[k] = c[k];
  co.cfg = c;
  try {
    const g = JSON.parse(localStorage.getItem("iride.coach") || "{}");
    co.an = g.an !== false; co.ton = !!g.ton;
    co.modus = g.modus === "berg" && c.ftp > 0 && c.w_prime > 0 ? "berg" : "grundlage";
    if (W_LISTE.includes(g.bergW)) co.bergW = g.bergW;
  } catch (e) { co.an = true; }
  coachReset(); coachKnoepfe();
  // iOS/Bluefy: Sprache erst nach einer Geste – die erste Berührung schaltet sie still frei
  if (co.ton) addEventListener("pointerdown", () => sprechen(" ", 0), { once: true });
}

function mittel(sek, feld) {
  let n = 0, s = 0;
  for (let i = co.proben.length - 1; i >= 0 && co.proben[i].t > co.uhr - sek; i--) {
    const v = co.proben[i][feld];
    if (v != null) { s += v; n++; }
  }
  return n ? s / n : null;
}
function hfTrend() {   // bpm/min, Steigung der Regressionsgeraden
  const ps = co.proben.filter(p => p.hf != null && p.t > co.uhr - COACH.hf_fenster);
  if (ps.length < COACH.hf_fenster / 3) return null;
  const mt = ps.reduce((a, p) => a + p.t, 0) / ps.length, mh = ps.reduce((a, p) => a + p.hf, 0) / ps.length;
  let zaehler = 0, nenner = 0;
  for (const p of ps) { zaehler += (p.t - mt) * (p.hf - mh); nenner += (p.t - mt) ** 2; }
  return nenner ? zaehler / nenner * 60 : null;
}

function coachTakt(dt) {
  if (!co.an || !co.cfg) return;
  const hfDa = Date.now() - z.hfZeit < VERALTET_MS;
  co.uhr += dt;
  while (co.naechste <= co.uhr) {
    const p = { t: co.naechste, w: z.watt, hf: hfDa ? z.hf : null, kad: z.kadenz, s: steigung(pos()), z: co.ziel };
    co.proben.push(p); co.naechste += 1;
    if (co.plan && p.w != null) co.wbal = Math.min(co.cfg.w_prime, wbalSchritt(co.wbal, p.w, 1));
    tfProbe(p);
  }
  const alt = co.uhr - Math.max(120, COACH.hf_fenster);
  while (co.proben.length && co.proben[0].t < alt) co.proben.shift();
  regeln();
}

// Tagesform: HF im Flachen bei Referenzleistung gegen die Referenz; deutlich höher → Band senken
function tfProbe(p) {
  const tf = co.tf, c = co.cfg;
  if ((tf.status !== "wartet" && tf.status !== "läuft") || z.fahrzeit < COACH.tf_ab) return;
  if (z.fahrzeit <= COACH.tf_bis) {
    tf.status = "läuft";
    const p30 = mittel(30, "w");
    if (p.hf != null && p30 != null && Math.abs(p.s) < 0.02 && Math.abs(p30 - c.ref_watt) <= COACH.tf_fenster)
      tf.werte.push(p.hf - COACH.hf_pro_watt * (p30 - c.ref_watt));
    return;
  }
  if (tf.werte.length < COACH.tf_proben) {
    tf.status = "ohne";
    coachLog("tagesform", `kein Vergleich, ${tf.werte.length} s gültig`);
    return;
  }
  tf.delta = tf.werte.reduce((a, b) => a + b, 0) / tf.werte.length - c.ref_hf;
  // Kontroll-HF der Fahrt für den Verlauf („Form“), auf die Referenzleistung umgerechnet
  if (fahrt) fahrt.tf = { hf: +(c.ref_hf + tf.delta).toFixed(1), w: c.ref_watt, n: tf.werte.length };
  const d = vz(tf.delta);
  if (tf.delta > COACH.tf_toleranz && co.plan) {
    co.bergSenkung = COACH.tf_senkung; bergPlan(); tf.status = "gesenkt";
    tf.melden = { art: "gelb", text: `Tagesform: Puls ${d} bei ${c.ref_watt} W – Grundleistung heute ${co.plan.p0} W`,
                  sprich: `Puls heute höher. Grundleistung ${co.plan.p0} Watt.` };
  } else if (tf.delta > COACH.tf_toleranz) {
    co.wMin -= COACH.tf_senkung; co.wMax -= COACH.tf_senkung; tf.status = "gesenkt";
    tf.melden = { art: "gelb", text: `Tagesform: Puls ${d} bei ${c.ref_watt} W – Ziel heute ${co.wMin}–${co.wMax} W`,
                  sprich: `Puls heute höher. Ziel ${co.wMin} bis ${co.wMax} Watt.` };
  } else {
    tf.status = "ok";
    tf.melden = { art: "gruen", text: `Tagesform ok: Puls ${d} bei ${c.ref_watt} W`, sprich: "Tagesform gut." };
  }
}
const vz = v => (v >= 0 ? "+" : "−") + zahl(Math.abs(v));

// Regeln nach Priorität; es kommt immer nur eine Ansage, frühestens COACH.abstand s nach der letzten
function regeln() {
  const K = COACH, t = co.uhr, s = steigung(pos()), w = Math.round;
  // Berg-Modus: das Band folgt dem Ziel der Stelle; im Schluss gibt es kein Zuviel
  const bArt = co.plan ? co.plan.art[bergIndex()] : null;
  if (co.plan) {
    co.ziel = bergZiel();
    const zm = Math.round(mittel(30, "z") ?? co.ziel);   // gegen das Ziel vergleichen, das im p30-Fenster galt
    co.wMin = zm - BERG.band; co.wMax = bArt === "schluss" ? co.ziel + 200 : zm + BERG.band;
    if (co.wbal > 0.5 * co.cfg.w_prime) co.budgetGesagt = false;
  }
  const p3 = co.p3 = mittel(3, "w"), p30 = co.p30 = mittel(30, "w");
  const hf = co.hf = mittel(5, "hf"), kad = mittel(5, "kad"), trend = co.trend = hfTrend();
  const hfVor = hf == null ? null : hf < co.decke - K.hf_trend_nah ? hf : hf + Math.max(0, trend || 0) * K.hf_vorschau;
  if (hf == null) co.hfAlarm = false;
  else if (hf > co.decke || hfVor > co.decke) co.hfAlarm = true;
  else if (hf <= co.decke - K.hf_hysterese) co.hfAlarm = false;
  if (bArt === "schluss") co.hfAlarm = false;   // all out: der Puls darf hoch
  if (p30 != null) {
    if (p30 > co.wMax + K.band_hysterese) co.band = "drueber";
    else if (p30 < co.wMin - K.band_hysterese) co.band = "drunter";
    else if (p30 >= co.wMin && p30 <= co.wMax) co.band = "drin";
  }
  const seit = (bed, alt) => bed ? (alt ?? t) : null;
  co.ueberSeit = seit(p3 != null && p3 > co.wMax + K.ueberzieh, co.ueberSeit);
  co.kadSeit = seit(kad != null && kad < co.kadMin && s >= K.kad_steigung, co.kadSeit);
  if (co.kadSeit == null) co.kadSerie = 0;
  const imBand = co.band === "drin" && !co.hfAlarm;

  const anlauf = t < K.anlauf;

  const r = rampeSuchen(K.rampe_weg), sHinter = steigung(pos() - 100);
  const rampe = !!r && r.grad >= K.rampe_ab && r.grad - s >= K.rampe_delta && Math.abs(pos() + r.weg - co.rampeBei) > 200;
  const nachlass = z.dist >= 150 && sHinter >= K.rampe_ab - 0.01 && sHinter - s >= K.nachlass_delta
    && pos() - co.nachlassBei > 300;
  const ziel = co.plan ? `Ziel ${co.ziel} W` : `Ziel ${co.wMin}–${co.wMax}`;
  const vor = co.plan && bArt !== "schluss" ? bergVorschau() : null;
  const rest = co.plan ? co.plan.gipfel - pos() : 0;
  const pct = co.plan ? Math.round(100 * Math.max(0, co.wbal) / co.cfg.w_prime) : 0;
  const kand = [
    { id: "hf", wenn: co.hfAlarm, art: "rot", sprich: "Puls hoch. Langsamer.",
      text: (hf > co.decke ? `Puls ${w(hf)} über ${co.decke}` : trend > 0.5 ? `Puls ${w(hf)} steigt ${vz(trend)}/min`
          : `Puls ${w(hf)} nah an ${co.decke}`) + ` – langsamer (${w(p30)} W)` },
    { id: "tagesform", wenn: !!co.tf.melden, einmal: true, ...co.tf.melden },
    { id: "schluss", wenn: bArt === "schluss" && !co.schlussGesagt, einmal: true, art: "rot",
      text: `Noch ${zahl(rest / 1000, 1)} km – alles raus: ${co.ziel} W`, sprich: `Letzter Kilometer. Alles raus, ${co.ziel} Watt.` },
    { id: "budget", wenn: bArt === "berg" && co.wbal < BERG.reserve * co.cfg.w_prime && !co.budgetGesagt, einmal: true,
      art: "gelb", text: `Reserve knapp (W′ ${pct} %) – ${co.ziel} W halten`, sprich: `Reserve knapp. ${co.ziel} Watt halten.` },
    { id: "vorschau", wenn: !!vor && vor.bei > co.vorschauBis, einmal: true, art: "blau",
      text: vor ? `In ${Math.round(vor.weg / 50) * 50} m ${zahl(vor.grad * 100, 1)} % über ${vor.laenge} m – bis dahin ${vor.jetzt} W, dort ${vor.ziel} W` : "",
      sprich: vor ? `In ${Math.round(vor.weg / 50) * 50} Metern ${zahl(vor.grad * 100, 0)} Prozent. Bis dahin ${vor.jetzt}, dort ${vor.ziel} Watt.` : "" },
    { id: "ruhiger", wenn: !co.hfAlarm && (ueberzieht || !anlauf && co.band === "drueber")
        && (!co.plan || co.wbal < BERG.knapp * co.cfg.w_prime), art: ueberzieht ? "rot" : "gelb",
      text: `${w(ueberzieht ? p3 : p30)} W – ruhiger, ${ziel}${co.plan ? ` (W′ ${pct} %)` : ""}`, sprich: "Ruhiger." },
    { id: "mehr", wenn: !anlauf && !co.hfAlarm && co.band === "drunter", art: "gelb",
      text: `${w(p30)} W – etwas mehr, ${ziel}`, sprich: "Etwas mehr." },
    { id: "leichter", wenn: co.kadSeit != null && t - co.kadSeit >= K.kad_dauer
        && (co.kadSerie < 2 || t - co.letzte.leichter >= K.kad_nachlass), art: "blau",
      text: co.kadSerie < 2 ? `Kadenz ${w(kad)} – leichter schalten` : `Kadenz ${w(kad)} – kein Gang mehr? Watt halten`,
      sprich: co.kadSerie < 2 ? "Leichter schalten." : "Watt halten." },
    { id: "rampe", wenn: rampe, einmal: true, art: "blau", sprich: "Rampe. Jetzt schalten, Watt halten.",
      text: r ? `${zahl(r.grad * 100, 1)} % ${r.weg < 30 ? "beginnt" : `in ${Math.round(r.weg / 10) * 10} m`} – jetzt schalten, Watt halten` : "" },
    { id: "nachlass", wenn: nachlass, einmal: true, art: "blau", sprich: "Schwerer schalten, Watt halten.",
      text: "Steigung lässt nach – schwerer schalten, Watt halten" },
    { id: "gut", wenn: !anlauf && co.bandSeit != null && t - co.bandSeit >= K.gut_nach && t - co.gutLetzt >= K.gut_wieder,
      einmal: true, art: "gruen", text: `gut so – ${w(p30)} W`, sprich: "Gut so." },
  ];
  if (t - co.letzteAnsage < K.abstand) return;
  for (const k of kand) {
    if (!k.wenn || (!k.einmal && t - (co.letzte[k.id] ?? -1e9) < K.wiederholen)) continue;
    co.letzteAnsage = t; co.letzte[k.id] = t;
    co.text = k.text; co.art = k.art; co.bis = Date.now() + 6000;
    sprechen(k.sprich);
    coachLog(k.id, k.text);
    if (k.id === "tagesform") co.tf.melden = null;
    if (k.id === "schluss") co.schlussGesagt = true;
    if (k.id === "budget") co.budgetGesagt = true;
    if (k.id === "vorschau") co.vorschauBis = vor.bei + vor.laenge;   // dieses Stück nicht noch einmal
    if (k.id === "rampe") co.rampeBei = pos() + r.weg;
    if (k.id === "nachlass") co.nachlassBei = pos();
    if (k.id === "gut") co.gutLetzt = t;
    if (k.id === "leichter") co.kadSerie++;
    return;
  }
}

function coachLog(id, text) {
  const f = v => v == null ? "" : Math.round(v);
  protokoll(`coach ${id} zeit=${f(z.fahrzeit)} dist=${f(z.dist)} w3=${f(co.p3)} w30=${f(co.p30)} hf=${f(co.hf)}`
    + ` trend=${co.trend == null ? "" : co.trend.toFixed(1)} kad=${f(mittel(5, "kad"))} s=${(steigung(z.dist) * 100).toFixed(1)}`
    + ` ziel=${co.wMin}-${co.wMax}/${co.decke}${bergProtokoll()} text=${encodeURIComponent(text)}`);
}
function bergProtokoll() {

}
// Zusatz fürs Positionsprotokoll alle 10 s: Grundlage für Zeit im Band und HF-Überschreitungen
function coachProtokoll() {

}

function coachInfo() {
  const tf = co.tf, d = tf.delta == null ? "" : vz(tf.delta) + " bpm";
  const tfText = {
    aus: "", wartet: `Tagesform ab ${zahl(COACH.tf_ab / 60)} min im Flachen bei ~${co.cfg.ref_watt} W`,
    "läuft": `Tagesform läuft (${tf.werte.length} s gültig)`, ok: `Tagesform ok (${d})`,

// iOS: Ansagen dürfen Musik aus einer anderen App nicht anhalten. Audio Session API (Safari/WebKit 17+):
// "ambient" mischt sich unter die Musik, "transient" senkt sie für die Ansage ab und gibt sie danach wieder frei.
// Ohne die API (ältere WebViews) bleibt es beim iOS-Verhalten: Musik hält an. Das Log zeigt, was das Gerät kann.
const sitzung = typ => { try { if (navigator.audioSession) navigator.audioSession.type = typ; } catch (e) {} };
sitzung("ambient");
protokoll("audiosession " + (navigator.audioSession ? "ja " + navigator.audioSession.type : "nein"));

let stimme = null;
function sprechen(text, laut = 1) {
  if (!co.ton || !("speechSynthesis" in window)) return;
  try {
    if (!stimme) stimme = speechSynthesis.getVoices().find(v => /^de/i.test(v.lang)) || null;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; u.rate = 1.05; u.volume = laut;

    u.onend = u.onerror = () => sitzung("ambient");

}
function coachKnoepfe() {
  $("btnCoach").classList.toggle("an", !!(co.an && co.cfg));

  $("btnTon").classList.toggle("an", co.ton);

  try { localStorage.setItem("iride.coach", JSON.stringify({ an: co.an, ton: co.ton, modus: co.modus, bergW: co.bergW })); } catch (e) {}
  bergKnoepfe();
}
$("btnCoach").onclick = () => {
  if (!co.cfg) { status("Coach: COACHING in lokal.py fehlt oder unvollständig"); return; }

};
$("btnTon").onclick = () => {
