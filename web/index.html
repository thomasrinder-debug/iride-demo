  if (co.ton) sprechen("Ton an");          // in der Geste sprechen: schaltet die Sprache in iOS frei
  else try { speechSynthesis.cancel(); } catch (e) {}
  coachKnoepfe();
};

// ------------------------------------------------------------------ Bluetooth
let geraet = null, manuellGetrennt = false, kickrAktiv = false;

function indoorBikeData(dv) {
  // FTMS Indoor Bike Data: Felder in fester Reihenfolge, je nach Flag-Bit vorhanden
  const f = dv.getUint16(0, true); let o = 2;
  const mitTempo = !(f & 0x0001);                                      // Bit 0 = "More Data": kein Tempo im Paket
  if (mitTempo) { z.tempo = dv.getUint16(o, true) / 100; o += 2; }
  if (f & 0x0002) o += 2;                                                 // mittleres Tempo
  if (f & 0x0004) { z.kadenz = dv.getUint16(o, true) / 2; o += 2; }
  if (f & 0x0008) o += 2;                                                 // mittlere Kadenz
  if (f & 0x0010) {                                                       // Gesamtdistanz (uint24, m)
    const d = dv.getUint16(o, true) + (dv.getUint8(o + 2) << 16); o += 3;
    // Basis bleibt über BLE-Ausfälle erhalten: der Zähler des Kickr läuft weiter, die Lücke wird nachgeholt.
    // Grenze nach Zeit (90 km/h); ein Neustart des Kickr (Zähler kleiner) ergibt ein riesiges Delta und wird verworfen.
    if (z.kickrDistAlt != null) {
      const delta = (d - z.kickrDistAlt + 0x1000000) % 0x1000000, s = (Date.now() - z.kickrDistZeit) / 1000;
      if (delta < 500 + 25 * s) {
        if (z.kurs && !z.scharf && !z.sim) z.dist = Math.min(z.kurs.laenge, z.dist + delta);
        if (delta >= 50) protokoll(`kickr-dist nachgeholt=${delta} nach=${s.toFixed(0)}s dist=${z.dist.toFixed(0)}`);
      } else protokoll(`kickr-dist verworfen delta=${delta} nach=${s.toFixed(0)}s`);
    }
    z.kickrDistAlt = d; z.kickrDistDa = true; z.kickrDistZeit = Date.now();
  }
  if (f & 0x0020) o += 2;                                                 // Widerstandsstufe
  if (f & 0x0040) { z.watt = dv.getInt16(o, true); o += 2; }
  if (f & 0x0080) o += 2;                                                 // mittlere Leistung
  if (f & 0x0100) o += 5;                                                 // Energie
  if (f & 0x0200) {                                                       // HF, falls der Kickr sie weiterreicht
    const hf = dv.getUint8(o); o += 1;
    if (hf > 0 && z.hfQuelle !== "gurt") { z.hf = hf; z.hfZeit = Date.now(); z.hfQuelle = "kickr"; }
  }
  if (mitTempo) z.datenZeit = Date.now();
}

let cpAlt = null;
function cpMessung(dv) {
  // Notbehelf ohne FTMS: Cycling Power Measurement mit Rad- und Kurbelumdrehungen
  const f = dv.getUint16(0, true); let o = 2;
  z.watt = dv.getInt16(o, true); o += 2;
  if (f & 0x01) o += 1;
  if (f & 0x04) o += 2;
  const neu = {};
  if (f & 0x10) { neu.rad = dv.getUint32(o, true); neu.radT = dv.getUint16(o + 4, true); o += 6; }
  if (f & 0x20) { neu.kurbel = dv.getUint16(o, true); neu.kurbelT = dv.getUint16(o + 2, true); o += 4; }
  if (cpAlt) {
    if (neu.rad != null && cpAlt.rad != null) {
      // Stillstand: gleiche Umdrehungszahl und Zeit; daran messen, wann sich das Rad zuletzt drehte
      // (z.datenZeit taugt nicht, es wird bei jedem Paket neu gesetzt). Zähler kleiner = Sensor-Reset.
      const dt = ((neu.radT - cpAlt.radT + 65536) % 65536) / 2048, n = neu.rad - cpAlt.rad;
      if (dt > 0 && n >= 0 && n < 50) z.tempo = n * RADUMFANG / dt * 3.6;
      else if (Date.now() - (cpAlt.radZeit || 0) > 2000) z.tempo = 0;
    }
    if (neu.kurbel != null && cpAlt.kurbel != null) {
      const dt = ((neu.kurbelT - cpAlt.kurbelT + 65536) % 65536) / 1024;
      if (dt > 0) z.kadenz = ((neu.kurbel - cpAlt.kurbel + 65536) % 65536) / dt * 60;
    }
  }
  const radNeu = neu.rad != null && (!cpAlt || neu.rad !== cpAlt.rad);
  cpAlt = { ...cpAlt, ...neu };
  if (radNeu) cpAlt.radZeit = Date.now();
  z.datenZeit = Date.now();
}

// FTMS Fitness Machine Status: Op-Code 0x12 = Indoor Bike Simulation Parameters Changed
// (Wind sint16 0,001 m/s, Steigung sint16 0,01 %, Crr uint8 0,0001, Cw uint8 0,01 kg/m)
function ftmsStatus(dv) {
  const op = dv.getUint8(0);
  if (op === 0x12 && dv.byteLength >= 5) {
    z.kickrSteigung = dv.getInt16(3, true) / 100; z.kickrSteigungZeit = Date.now();
    protokoll(`ftms-sim grad=${z.kickrSteigung.toFixed(2)} dist=${z.dist.toFixed(0)}`
      + ` kurs=${(steigung(z.dist) * 100).toFixed(1)} wind=${(dv.getInt16(1, true) / 1000).toFixed(2)}`
      + (dv.byteLength >= 7 ? ` crr=${dv.getUint8(5) / 10000} cw=${dv.getUint8(6) / 100}` : ""));
  } else {
    protokoll(`ftms-status op=0x${op.toString(16)} bytes=${[...new Uint8Array(dv.buffer)].map(b => b.toString(16).padStart(2, "0")).join("")}`);
  }
}

// Wiederverbinden für ein BLE-Gerät. st.gen zählt Verbindungswahlen hoch: eine neue Wahl beendet alte
// Schleifen; st.laeuft verhindert eine zweite Schleife für dieselbe Wahl. Erfolg erst nach startNotifications;
// scheitert das Abonnieren bei stehender GATT-Verbindung, wird getrennt, sonst endete die Schleife ohne Daten.
// Wiederverbinden nach Abbruch, solange weiter() gilt. Ein Versuch bekommt höchstens BLE_ABO_MS, sonst blockiert ein
// hängendes gatt.connect() in Bluefy alle weiteren. Versuche 1–5, dann jeder 10. ins Protokoll.
// Pause: 3 s, ab Versuch BLE_SCHNELL[name] BLE_LANGSAM_MS. Die 4iiii schläft, wenn die Kurbel steht, und nimmt die
// Verbindung dann kurz an und lässt sie wieder fallen: alle 3 s ein „Verbunden“ von Bluefy (25.10.2026, 14:42–14:48).
const BLE_ABO_MS = 15000, BLE_LANGSAM_MS = 30000;
const BLE_SCHNELL = { kickr: 20, hf: 10, kurbel: 5 };
async function bleWiederVerbinden(st, g, weiter, abo, melden, name = "ble", ok = null) {
  const gen = st.gen;
  if (!g || st.laeuft === gen) return;
  st.laeuft = gen;
  try {
    // Flattern: Abbruch kurz nach erfolgreichem Wiederverbinden zählt als Fehlversuch, ab dem dritten erst lange Pause
    st.flattern = Date.now() - (st.seit || 0) < 20000 ? (st.flattern || 0) + 1 : 0;
    if (st.flattern >= 3) {
      protokoll(`${name}-status flattert n=${st.flattern} – Pause ${BLE_LANGSAM_MS / 1000}s`);
      await new Promise(ok => setTimeout(ok, BLE_LANGSAM_MS));
    }
    for (let v = 1; weiter() && st.gen === gen && !g.gatt.connected; v++) {
      if (melden) melden(v);
      try {
        await Promise.race([abo(), new Promise((_, nein) => setTimeout(() => nein(new Error("Zeitüberschreitung")), BLE_ABO_MS))]);
        protokoll(`${name}-status wieder verbunden versuch=${v}`);
        st.seit = Date.now();
        if (ok) ok();
        return;
      } catch (e) {
        if (v <= 5 || v % 10 === 0)
          protokoll(`${name}-status versuch=${v} fehler=${String(e && e.message || e).replace(/\s+/g, "_").slice(0, 80)}`);
        if (g.gatt.connected) g.gatt.disconnect();
        await new Promise(ok => setTimeout(ok, v >= (BLE_SCHNELL[name] || 10) ? BLE_LANGSAM_MS : 3000));
      }
    }
  } finally { if (st.laeuft === gen) st.laeuft = null; }
}
const kickrBle = { gen: 0, laeuft: null }, hfBle = { gen: 0, laeuft: null }, kurbelBle = { gen: 0, laeuft: null };

async function abonnieren() {
  const server = await geraet.gatt.connect();
  try {
    const dienst = await server.getPrimaryService(FTMS);
    const ch = await dienst.getCharacteristic(INDOOR_BIKE_DATA);
    ch.addEventListener("characteristicvaluechanged", e => indoorBikeData(e.target.value));
    await ch.startNotifications();
    status(`${geraet.name || "Kickr"} verbunden (FTMS)`);
    // Nur mithören: meldet der Kickr, welche Steigung der Edge gerade gesetzt hat? (Fitness Machine Status)
    try {
      const st = await dienst.getCharacteristic(FTMS_STATUS);
      st.addEventListener("characteristicvaluechanged", e => ftmsStatus(e.target.value));
      await st.startNotifications();
      protokoll("ftms-status abonniert");
    } catch (e) { protokoll("ftms-status nicht verfügbar " + (e && e.message || e)); }
  } catch (e) {
    const dienst = await server.getPrimaryService(CPS);
    const ch = await dienst.getCharacteristic(CP_MESSUNG);
    cpAlt = null; z.kickrDistDa = false;     // CPS hat keine Gesamtdistanz: wieder integrieren
    ch.addEventListener("characteristicvaluechanged", e2 => cpMessung(e2.target.value));
    await ch.startNotifications();
    status(`${geraet.name || "Kickr"} verbunden (Cycling Power, Tempo geschätzt)`);
  }
}

function wiederVerbinden() {
  if (kickrBle.laeuft == null && !manuellGetrennt && geraet && !geraet.gatt.connected) protokoll("kickr-status getrennt");
  return bleWiederVerbinden(kickrBle, geraet, () => !manuellGetrennt, abonnieren,
    v => status(`Verbindung verloren – Versuch ${v} …`), "kickr");
}
// Bluefy: Der Kickr kann als verbunden gelten und trotzdem nichts mehr senden (25.10.2026, 14:38, ohne
// Trennmeldung; die 4iiii lief weiter). Nach KICKR_STILLE_MS ohne Daten trennen und neu verbinden,
// höchstens alle KICKR_WACHE_MS (steht der Kickr still und sendet deshalb nichts, schadet das nicht).
function kickrWache() {
  const jetzt = Date.now();
  if (!kickrAktiv || manuellGetrennt || z.sim || !geraet || !geraet.gatt.connected || kickrBle.laeuft != null) return;
  if (!z.datenZeit || jetzt - z.datenZeit < KICKR_STILLE_MS || jetzt - kickrWacheZuletzt < KICKR_WACHE_MS) return;
  kickrWacheZuletzt = jetzt;
  protokoll(`kickr-stille ${Math.round((jetzt - z.datenZeit) / 1000)}s verbunden=1 – neu verbinden`);
  geraet.gatt.disconnect();
  wiederVerbinden();
}
// Zustand für fehlerMelden(): letzte Taste, Verbindungen, Alter der Daten (einziger globaler Name aus diesem Block)
let letzteTaste = "";
addEventListener("click", e => { const b = e.target.closest && e.target.closest("button"); if (b) letzteTaste = b.id; }, true);
window.irideKontext = () => {
  const alter = t => (t ? Math.round((Date.now() - t) / 1000) + "s" : "–");
  return `taste=${letzteTaste || "–"} sicht=${document.visibilityState} kickr=${geraet ? (geraet.gatt.connected ? "verb" : "getr") : "–"}`
    + ` kickr_daten=${alter(z.datenZeit)} wieder=${kickrBle.laeuft != null ? 1 : 0}`
    + ` hf=${hfGeraet ? (hfGeraet.gatt.connected ? "verb" : "getr") : "–"} kurbel=${kurbelGeraet ? (kurbelGeraet.gatt.connected ? "verb" : "getr") : "–"}`
    + ` kurbel_daten=${alter(z.kurbelZeit)} dist=${Math.round(z.dist)}`;
};

$("btnKickr").onclick = async () => {
  if (!navigator.bluetooth) {
    status(window.isSecureContext ? "kein Web Bluetooth – Bluefy benutzen" : "kein Web Bluetooth (unsicherer Kontext, https nutzen)");
    return;
  }
  if (geraet && geraet.gatt.connected) {
    manuellGetrennt = true; kickrAktiv = false; geraet.gatt.disconnect();
    $("btnKickr").textContent = "Kickr verbinden"; $("btnKickr").classList.remove("an");
    status("getrennt"); return;
  }
  try {
    status("Gerät wählen …");
    await kickrMit(await navigator.bluetooth.requestDevice(GERAETE.kickr.wahl()));
  } catch (e) {
    // verbunden, aber nicht abonniert: trennen, sonst sieht es verbunden aus und liefert nichts
    if (geraet && geraet.gatt.connected) { manuellGetrennt = true; kickrAktiv = false; geraet.gatt.disconnect(); }
    status("Bluetooth: " + e.message);
  }
};

// Gewähltes oder schon erlaubtes Gerät als Kickr übernehmen (Knopf, „Alle verbinden“)
async function kickrMit(g) {
  kickrBle.gen++;                            // laufende Wiederverbindung des alten Geräts beenden
  geraet = g; manuellGetrennt = false; kickrAktiv = true;
  bleHorchen(g, wiederVerbinden);
  await abonnieren();
  kickrVerbunden();
}
function kickrVerbunden() {
  geraetMerken("kickr", geraet);
  $("btnKickr").textContent = "Kickr trennen"; $("btnKickr").classList.add("an");
  if (z.sim) $("btnSim").click();
  wachHalten();
}

// ------------------------------------------------------------------ Herzfrequenzgurt (BLE Heart Rate 0x180D)
let hfGeraet = null, hfManuell = false;
function hfMessung(dv) {
  const f = dv.getUint8(0);
  z.hf = (f & 0x01) ? dv.getUint16(1, true) : dv.getUint8(1);
  z.hfZeit = Date.now(); z.hfQuelle = "gurt";
}
async function hfAbonnieren() {
  const server = await hfGeraet.gatt.connect();
  const ch = await (await server.getPrimaryService("heart_rate")).getCharacteristic("heart_rate_measurement");
  ch.addEventListener("characteristicvaluechanged", e => hfMessung(e.target.value));
  await ch.startNotifications();
}
function hfWiederVerbinden() {
  z.hfQuelle = "";
  if (hfBle.laeuft == null && !hfManuell && hfGeraet && !hfGeraet.gatt.connected) protokoll("hf-status getrennt");
  return bleWiederVerbinden(hfBle, hfGeraet, () => !hfManuell, hfAbonnieren, null, "hf");
}
$("btnHf").onclick = async () => {
  if (!navigator.bluetooth) { status("kein Web Bluetooth – Bluefy benutzen"); return; }
  if (hfGeraet && hfGeraet.gatt.connected) {
    hfManuell = true; hfGeraet.gatt.disconnect(); z.hfQuelle = "";
    $("btnHf").textContent = "HF verbinden"; $("btnHf").classList.remove("an"); return;
  }
  try {
    await hfMit(await navigator.bluetooth.requestDevice(GERAETE.hf.wahl()));
  } catch (e) {
    if (hfGeraet && hfGeraet.gatt.connected) { hfManuell = true; hfGeraet.gatt.disconnect(); }
    status("HF: " + e.message);
  }
};

async function hfMit(g) {
  hfBle.gen++;
  hfGeraet = g; hfManuell = false;
  bleHorchen(g, hfWiederVerbinden);
  await hfAbonnieren();
  hfVerbunden();
}
function hfVerbunden() {
  geraetMerken("hf", hfGeraet);
  $("btnHf").textContent = "HF trennen"; $("btnHf").classList.add("an");
}

// ------------------------------------------------------------------ 4iiii-Kurbel (BLE Cycling Power 0x1818), nur zum Vergleich
// Eigener Parser mit Ziel z.wattKurbel: cpMessung schreibt nach z.watt (Kickr) und bleibt dem Kickr vorbehalten.
// Die Kurbel misst nur links und verdoppelt; sie steuert nichts, ein Ausfall berührt Kickr-Anzeige und Fahrt nicht.
let kurbelGeraet = null, kurbelManuell = false, kurbelAlt = null;
function kurbelMessung(dv) {
  const f = dv.getUint16(0, true); let o = 2;
  z.wattKurbel = dv.getInt16(o, true); o += 2;
  if (f & 0x01) o += 1;                                                   // Pedalbalance
  if (f & 0x04) o += 2;                                                   // akkumuliertes Drehmoment
  if (f & 0x10) o += 6;                                                   // Radumdrehungen
  if (f & 0x20) {                                                         // Kurbelumdrehungen → Kadenz
    const n = dv.getUint16(o, true), t = dv.getUint16(o + 2, true);
    if (kurbelAlt) {
      const dt = ((t - kurbelAlt.t + 65536) % 65536) / 1024;
      if (dt > 0) z.kadKurbel = ((n - kurbelAlt.n + 65536) % 65536) / dt * 60;
      else if (Date.now() - kurbelAlt.zeit > 3000) z.kadKurbel = 0;
    }
    if (!kurbelAlt || n !== kurbelAlt.n) kurbelAlt = { n, t, zeit: Date.now() };
  }
  z.kurbelZeit = Date.now();
}
async function kurbelAbonnieren() {
  const server = await kurbelGeraet.gatt.connect();
  const ch = await (await server.getPrimaryService(CPS)).getCharacteristic(CP_MESSUNG);
  kurbelAlt = null;
  ch.addEventListener("characteristicvaluechanged", e => kurbelMessung(e.target.value));
  await ch.startNotifications();
  protokoll(`kurbel-status verbunden name=${(kurbelGeraet.name || "").replace(/\s/g, "_")}`);
}
function kurbelWiederVerbinden() {
  if (kurbelBle.laeuft == null && !kurbelManuell && kurbelGeraet && !kurbelGeraet.gatt.connected) protokoll("kurbel-status getrennt");
  return bleWiederVerbinden(kurbelBle, kurbelGeraet, () => !kurbelManuell, kurbelAbonnieren, null, "kurbel");
}
$("btnKurbel").onclick = async () => {
  if (!navigator.bluetooth) { status("kein Web Bluetooth – Bluefy benutzen"); return; }
  if (kurbelGeraet && kurbelGeraet.gatt.connected) {
    kurbelManuell = true; kurbelGeraet.gatt.disconnect(); z.kurbelZeit = 0;
    $("btnKurbel").textContent = "Kurbel verbinden"; $("btnKurbel").classList.remove("an"); kurbelAnzeige(); return;
  }
  try {
    // Kickr und 4iiii melden beide Cycling Power: in der Auswahl die 4iiii nehmen, nicht den KICKR
    await kurbelMit(await navigator.bluetooth.requestDevice(GERAETE.kurbel.wahl()));
  } catch (e) {
    // gescheitert: Gerät vergessen, sonst stünde dauerhaft „4iiii –“ in der Kachel
    if (kurbelGeraet) { kurbelManuell = true; if (kurbelGeraet.gatt.connected) kurbelGeraet.gatt.disconnect(); }
    kurbelGeraet = null; kurbelAnzeige();
    status("Kurbel: " + e.message);
  }
};
async function kurbelMit(g) {
  if (/kickr/i.test(g.name || "")) throw new Error("das ist der Kickr – bitte die 4iiii wählen");
  kurbelBle.gen++;
  kurbelGeraet = g; kurbelManuell = false;
  bleHorchen(g, kurbelWiederVerbinden);
  await kurbelAbonnieren();
  kurbelVerbunden();
}
function kurbelVerbunden() {
  geraetMerken("kurbel", kurbelGeraet);
  $("btnKurbel").textContent = "Kurbel trennen"; $("btnKurbel").classList.add("an");
}

// ------------------------------------------------------------------ Geräte automatisch verbinden
// Es sind immer dieselben drei Geräte. Gemerkt werden id und Name (nur in diesem Browser, localStorage).
// 1. Beim Öffnen: navigator.bluetooth.getDevices() liefert die schon erlaubten Geräte; die gemerkten werden
//    ohne Tipp verbunden. Mit watchAdvertisements() erst, wenn das Gerät sendet, sonst über die Wiederverbindungsschleife.
//    Ob Bluefy getDevices()/watchAdvertisements() kann, steht im Protokoll (ble-faehig …); Chrome nur mit Flags.
// 2. Ohne getDevices: „Alle verbinden“ öffnet nacheinander die Auswahl je fehlendem Gerät, gefiltert auf den
//    gemerkten Namen (nur ein Eintrag). Verlangt der Browser je Auswahl einen eigenen Tipp, heißt der Knopf danach
//    „Weiter: HF“ usw.
const GERAETE = {
  kickr: {
    text: "Kickr", knopf: "btnKickr", ble: kickrBle, dienste: [FTMS, CPS],
    filter: [{ services: [FTMS] }, { services: [CPS] }, { namePrefix: "KICKR" }],
    g: () => geraet, aus: () => manuellGetrennt, mit: g => kickrMit(g), abo: () => abonnieren(),
    vorbereiten: g => { kickrBle.gen++; geraet = g; manuellGetrennt = false; kickrAktiv = true; bleHorchen(g, wiederVerbinden); },
    fertig: () => kickrVerbunden(), stopp: () => { manuellGetrennt = true; kickrAktiv = false; },
  },
  hf: {
    text: "HF", knopf: "btnHf", ble: hfBle, dienste: ["heart_rate"],
    filter: [{ services: ["heart_rate"] }],
    g: () => hfGeraet, aus: () => hfManuell, mit: g => hfMit(g), abo: () => hfAbonnieren(),
    vorbereiten: g => { hfBle.gen++; hfGeraet = g; hfManuell = false; bleHorchen(g, hfWiederVerbinden); },
    fertig: () => hfVerbunden(), stopp: () => { hfManuell = true; z.hfQuelle = ""; },
  },
  kurbel: {
    text: "Kurbel", knopf: "btnKurbel", ble: kurbelBle, dienste: [CPS],
    filter: [{ services: [CPS] }],
    g: () => kurbelGeraet, aus: () => kurbelManuell, mit: g => kurbelMit(g), abo: () => kurbelAbonnieren(),
    vorbereiten: g => { kurbelBle.gen++; kurbelGeraet = g; kurbelManuell = false; bleHorchen(g, kurbelWiederVerbinden); },
    fertig: () => kurbelVerbunden(), stopp: () => { kurbelManuell = true; },
  },
};
// Auswahl: einzelne Knöpfe zeigen alle passenden Geräte (anderes Gerät wählbar), „Alle verbinden“ nur das gemerkte
for (const r of Object.values(GERAETE))
  r.wahl = (nurGemerkt = false) => {
    const m = gemerkteGeraete()[Object.keys(GERAETE).find(k => GERAETE[k] === r)];
    return nurGemerkt && m && m.name ? { filters: [{ name: m.name }], optionalServices: r.dienste }
                                     : { filters: r.filter, optionalServices: r.dienste };
  };
const verbunden = r => !!(r.g() && r.g().gatt.connected);
// sucht: Wiederverbindungsschleife läuft oder es wird auf das Funksignal gewartet
const sucht = r => !!(r.g() && !r.g().gatt.connected && !r.aus() && (r.ble.laeuft != null || r.g()._irideWartet));

function gemerkteGeraete() { try { return JSON.parse(localStorage.getItem("iride.geraete") || "{}"); } catch (e) { return {}; } }
function geraetMerken(rolle, g) {
  if (!g) return;
  const m = gemerkteGeraete();
  if (m[rolle] && m[rolle].id === g.id && m[rolle].name === g.name) return;
  m[rolle] = { id: g.id, name: g.name || "" };
  try { localStorage.setItem("iride.geraete", JSON.stringify(m)); } catch (e) {}
  protokoll(`ble-gemerkt ${rolle}`);
}
// Trennmeldung nur einmal je Geräteobjekt anhängen (getDevices und requestDevice können dasselbe Objekt liefern)
function bleHorchen(g, f) {
  if (g._irideHorcht === f) return;
  if (g._irideHorcht) g.removeEventListener("gattserverdisconnected", g._irideHorcht);
  g.addEventListener("gattserverdisconnected", f); g._irideHorcht = f;
}

async function geraeteAutomatisch() {
  const bt = navigator.bluetooth;
  const gd = !!(bt && bt.getDevices), wa = !!(window.BluetoothDevice && BluetoothDevice.prototype.watchAdvertisements);
  protokoll(`ble-faehig bluetooth=${bt ? 1 : 0} getDevices=${gd ? 1 : 0} watchAdvertisements=${wa ? 1 : 0}`);
  if (!gd) return;
  let liste;
  try { liste = await bt.getDevices(); } catch (e) { protokoll("ble-erlaubt fehler=" + String(e && e.message || e).replace(/\s+/g, "_").slice(0, 80)); return; }
  const m = gemerkteGeraete();
  protokoll(`ble-erlaubt n=${liste.length} gemerkt=${Object.keys(m).join(",") || "-"}`);
  for (const [rolle, r] of Object.entries(GERAETE)) {
    if (!m[rolle] || verbunden(r) || sucht(r)) continue;
    const g = liste.find(d => d.id === m[rolle].id) || liste.find(d => m[rolle].name && d.name === m[rolle].name);
    if (g) automatischVerbinden(rolle, r, g, wa);
  }
}
async function automatischVerbinden(rolle, r, g, wa) {
  r.vorbereiten(g);
  const gen = r.ble.gen;
  const los = () => {
    if (r.ble.gen !== gen || r.aus() || g.gatt.connected) return;
    bleWiederVerbinden(r.ble, g, () => !r.aus(), r.abo, v => status(`${r.text} suchen – Versuch ${v} …`), rolle,
      () => { status(`${r.text} automatisch verbunden`); r.fertig(); });
  };
  if (wa) {
    // erst verbinden, wenn das Gerät funkt (Chrome verbindet erlaubte Geräte sonst oft nicht: „no longer in range“)
    try {
      const abbruch = new AbortController();
      g._irideWartet = true;
      g.addEventListener("advertisementreceived", () => { g._irideWartet = false; abbruch.abort(); los(); }, { once: true });
      await g.watchAdvertisements({ signal: abbruch.signal });
      protokoll(`ble-auto ${rolle} wartet auf Funksignal`);
      return;
    } catch (e) { g._irideWartet = false; protokoll(`ble-auto ${rolle} watch fehler=` + String(e && e.message || e).replace(/\s+/g, "_").slice(0, 60)); }
  }
  protokoll(`ble-auto ${rolle} verbinden`);
  los();
}

// „Alle verbinden“: je Tipp so viele fehlende Geräte wie der Browser ohne neuen Tipp erlaubt
const alleUebersprungen = new Set();
let alleBegonnen = false;
function alleFehlend() {
  return Object.keys(GERAETE).filter(k => !verbunden(GERAETE[k]) && !sucht(GERAETE[k]) && !alleUebersprungen.has(k));
}
$("btnAlle").onclick = async () => {
  if (!navigator.bluetooth) { status("kein Web Bluetooth – Bluefy benutzen"); return; }
  let offen = alleFehlend();
  if (!offen.length) { alleUebersprungen.clear(); offen = alleFehlend(); }
  alleBegonnen = true;
  for (const rolle of offen) {
    const r = GERAETE[rolle];
    let neu = null;
    try {
      status(`${r.text} wählen …`);
      neu = await navigator.bluetooth.requestDevice(r.wahl(true));
      await r.mit(neu);
      status(`${r.text} verbunden`);
    } catch (e) {
      const n = e && e.name, text = String(e && e.message || e);
      if (n === "SecurityError" || /gesture|user activation/i.test(text)) {
        status(`${r.text}: noch einmal tippen`);              // Browser will je Auswahl einen eigenen Tipp
        protokoll(`ble-alle ${rolle} braucht neuen Tipp`);
      } else {
        alleUebersprungen.add(rolle);                          // abgebrochen oder nicht gefunden: beim nächsten Tipp das nächste Gerät
        // verbunden, aber nicht abonniert: trennen, sonst sieht es verbunden aus und liefert nichts
        if (neu && r.g() === neu) { r.stopp(); if (neu.gatt.connected) neu.gatt.disconnect(); }
        status(`${r.text}: ${text}`);
        protokoll(`ble-alle ${rolle} fehler=${n || ""}_` + text.replace(/\s+/g, "_").slice(0, 60));
      }
      break;
    }
  }
  knoepfeAktualisieren();
};
// Knöpfe nach Zustand: verbundene treten zurück (klein, gedimmt), suchende zeigen „sucht …“
function knoepfeAktualisieren() {
  let fehlt = 0;
  for (const r of Object.values(GERAETE)) {
    const b = $(r.knopf), v = verbunden(r), s = sucht(r);
    const t = v ? `${r.text} trennen` : s ? `${r.text} sucht …` : `${r.text} verbinden`;
    if (b.textContent !== t) b.textContent = t;
    b.classList.toggle("an", v); b.classList.toggle("zurueck", v); b.classList.toggle("sucht", s);
    if (!v && !s) fehlt++;
  }
  const a = $("btnAlle"), offen = alleFehlend();
  a.hidden = !fehlt || !navigator.bluetooth;
  if (!offen.length) { alleBegonnen = false; alleUebersprungen.clear(); }
  const t = alleBegonnen && offen.length ? `Weiter: ${GERAETE[offen[0]].text}` : "Alle verbinden";
  if (a.textContent !== t) a.textContent = t;
}

// Zweite Zeile in der Leistungskachel; ohne Kurbel bleibt die Kachel wie bisher
function kurbelAnzeige() {
  const an = !!(kurbelGeraet && kurbelGeraet.gatt.connected) || (kurbelGeraet && !kurbelManuell);
  const el = $("wKurbel");
  el.hidden = !an;
  if (!an) return;
  if ($("tWatt").textContent.startsWith("Leistung") && !$("tWatt").textContent.startsWith("Leistung Kickr"))
    $("tWatt").textContent = $("tWatt").textContent.replace(/^Leistung/, "Leistung Kickr");
  const frisch = Date.now() - z.kurbelZeit < VERALTET_MS;
  el.innerHTML = frisch && z.wattKurbel != null ? `4iiii <b>${zahl(z.wattKurbel)}</b> W` : "4iiii –";
}
// Vergleichszeile je Sekunde: Kickr- und Kurbel-Watt, beide auf diesem iPad gestempelt (t = ms seit 1970)
function kurbelProtokoll() {
  const jetzt = Date.now(), kf = jetzt - z.datenZeit < VERALTET_MS, uf = jetzt - z.kurbelZeit < VERALTET_MS;
  protokoll(`kurbel t=${jetzt} w_kickr=${kf && z.watt != null ? z.watt : ""} w_4iiii=${uf && z.wattKurbel != null ? z.wattKurbel : ""}`
    + ` kad=${kf && z.kadenz != null ? Math.round(z.kadenz) : ""} kad_4iiii=${uf && z.kadKurbel != null ? Math.round(z.kadKurbel) : ""}`
    + ` v=${kf && z.tempo != null ? z.tempo.toFixed(1) : ""} dist=${z.dist.toFixed(0)}`
    + ` grad=${z.kurs ? (steigung(z.dist) * 100).toFixed(1) : ""}`
    + ` kickrSteigung=${z.kickrSteigung != null ? z.kickrSteigung.toFixed(2) : ""}`
    + ` kickrSteigungAlter=${z.kickrSteigungZeit ? Math.round((jetzt - z.kickrSteigungZeit) / 1000) : ""}`
    + ` sim=${z.sim ? 1 : 0}`);
}

// ------------------------------------------------------------------ Street View
// Street View (14.11.): zwei langlebige Panorama-Fenster übereinander (getPanorama/setPano kosten bei Google nichts
// extra, nur das Anlegen der Objekte). Ablauf:
//  1. svSuchen: Panoramen bis SV_HORIZONT m voraus suchen (Vorrat svv, je Abfrage eine Stelle, alle SV_ABSTAND m).
//  2. svVorbereiten: das nächste passende Panorama lädt schon im hinteren, unsichtbaren Fenster.
//  3. svWechseln: erreicht die Position das Panorama, wird das neue Bild über dem alten eingeblendet.
// Blick, Pitch und ID des sichtbaren Bildes (sv) werden erst beim Wechsel übernommen, das alte Bild schwenkt nicht mit.
let svPanos = [], svVorn = 0, svDienst = null, svQuelle = null;
const svZoom = () => blick === 0 ? 1.0 : 0.45;   // Zoom 1 ≈ 90°, 0,45 ≈ 130° Sichtfeld
const svEl = i => $(i ? "sv2" : "sv");
const svTangente = d => kurswinkel(punkt(d - 5), punkt(d + 10));   // Straßenrichtung an der Stelle (nicht weit voraus)
function svSchritt(d) {
  return Math.abs(winkelDiff(svTangente(d), svTangente(d + 15))) > SV_KURVE ? SV_ABSTAND / 2 : SV_ABSTAND;
}
function panoGeladen(pano, id) {
  return new Promise(ok => {
    const l = google.maps.event.addListener(pano, "status_changed", () => {
      if (pano.getPano() !== id) return;
      google.maps.event.removeListener(l); ok(pano.getStatus());
    });
    setTimeout(() => { google.maps.event.removeListener(l); ok("timeout"); }, 4000);
  });
}

async function googleLaden(schluessel) {
  window.gm_authFailure = () => {
    z.svStatus = "abgelehnt"; layout(false);
    $("hinweis").textContent = "Google-Schlüssel abgelehnt (Referrer-Einschränkung prüfen)";
  };
  await new Promise((ok, fehler) => {
    window.__googleBereit = ok;
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(schluessel)}&v=weekly&loading=async&callback=__googleBereit`;
    s.onerror = fehler; document.head.appendChild(s);
  });
  const lib = await google.maps.importLibrary("streetView");
  svDienst = new lib.StreetViewService();
  svQuelle = lib.StreetViewSource ? [lib.StreetViewSource.OUTDOOR] : undefined;
  svPanos = ["sv", "sv2"].map(id => new lib.StreetViewPanorama($(id), {
    disableDefaultUI: true, clickToGo: false, linksControl: false, showRoadLabels: false,
    motionTracking: false, motionTrackingControl: false, scrollwheel: false, visible: true,
  }));
  z.svStatus = "bereit";
}

// Google-Auto fuhr gegen die eigene Richtung (ohne centerHeading: unbekannt, gilt als passend)
function gegenlaeufig(data, richtung) {
  const h = data.tiles && data.tiles.centerHeading;
  return h != null && Math.abs(winkelDiff(richtung, h)) > 90;
}

// Ersatz in Fahrtrichtung: erst ältere Aufnahmen derselben Stelle (data.time, nicht dokumentiert, daher defensiv),
// dann die Spur weiter rechts (bei Linksverkehr links). Nichts gefunden: null, das gegenläufige Bild bleibt.
async function svFahrtrichtung(data, richtung, p, quer) {
  const passt = d => d && !gegenlaeufig(d, richtung)
    && abstand({ lat: d.location.latLng.lat(), lon: d.location.latLng.lng() }, p) <= SV_SPUR;
  const jahr = d => +((d.imageDate || "").slice(0, 4)) || 0;
  const alt = (Array.isArray(data.time) ? data.time : []).map(t => t && t.pano)
    .filter(id => id && id !== data.location.pano).reverse().slice(0, SV_ALTERNATIVEN);
  for (const id of alt) {
    try {
      const { data: d } = await svDienst.getPanorama({ pano: id });
      if (passt(d) && jahr(d) >= SV_ALT_AB) return d;
    } catch (e) {}
  }
  try {
    const weit = { lat: p.lat + 2.5 * SV_SEITE * Math.cos(quer) / 111320,
                   lng: p.lon + 2.5 * SV_SEITE * Math.sin(quer) / (111320 * Math.cos(p.lat * RAD)) };
    const anfrage = { location: weit, radius: SV_SEITE * 2, preference: "nearest" };
    if (svQuelle) anfrage.sources = svQuelle;
    const { data: d } = await svDienst.getPanorama(anfrage);
    if (passt(d)) return d;
  } catch (e) {}
  return null;
}

function svReset() {
  svv.gen++; Object.assign(svv, { frei: true, bis: -1e9, liste: [], fehler: 0, pause: 0 });
  svh.kand = null; svh.status = "leer";
  Object.assign(sv, { id: null, heading: null, panoD: 0, distWechsel: 0 });
}

// Streckenposition eines Panoramas: nächster Kurspunkt im Fenster ±30 m um die Abfragestelle (2-m-Raster).
// quer = echter Abstand zur Strecke; ein Serpentinen-Schenkel liegt außerhalb des Fensters und fällt durch SV_SPUR.
function svStreckenpos(ll, dq) {
  let best = dq, ba = Infinity;
  for (let d = Math.max(0, dq - 30); d <= Math.min(z.kurs.laenge, dq + 30); d += 2) {
    const a = abstand(punkt(d), ll);
    if (a < ba) { ba = a; best = d; }
  }
  return { d: best, quer: ba };
}

// Ein Panorama für die Stelle dq suchen. undefined: andere Straße (überspringen). Wirft bei Fehlern.
async function svKandidat(dq) {
  const p = punkt(dq);
  // Suchpunkt SV_SEITE m quer zur Fahrtrichtung versetzt (rechts, bei Linksverkehr links)
  const land = ((z.kursName || "").match(/^Katalog_([a-z]{2})-/i) || [])[1];
  const quer = (svTangente(dq) + (LINKSVERKEHR.includes((land || "").toLowerCase()) ? -90 : 90)) * RAD;
  const anfrage = { location: { lat: p.lat + SV_SEITE * Math.cos(quer) / 111320,
                                lng: p.lon + SV_SEITE * Math.sin(quer) / (111320 * Math.cos(p.lat * RAD)) },
                    radius: SV_RADIUS, preference: "nearest" };
  if (svQuelle) anfrage.sources = svQuelle;
  let { data } = await svDienst.getPanorama(anfrage);
  const lage = d => svStreckenpos({ lat: d.location.latLng.lat(), lon: d.location.latLng.lng() }, dq);
  let s = lage(data);
  if (s.quer > SV_SPUR) return undefined;   // andere Straße
  if (gegenlaeufig(data, svTangente(s.d))) {
    const alt = await svFahrtrichtung(data, svTangente(s.d), p, quer);
    if (alt) { data = alt; s = lage(data); }
  }
  const richtung = svTangente(s.d);         // Blick steht je Foto fest, in Fahrtrichtung der Straße am Panorama
  return { d: s.d, id: data.location.pano, heading: richtung, pitch: Math.atan(steigung(s.d)) / RAD,
           datum: data.imageDate || "", gegen: gegenlaeufig(data, richtung) };
}

// Vorrat auffüllen: immer nur eine Abfrage gleichzeitig
async function svSuchen() {
  if (!svv.frei || Date.now() < svv.pause) return;
  const d = pos(), dq = Math.max(svv.bis + svSchritt(Math.max(0, svv.bis)), d);
  if (dq > Math.min(z.kurs.laenge, d + SV_HORIZONT)) return;
  svv.frei = false;
  const gen = svv.gen;
  let kand, weiter = true;
  try { kand = await svKandidat(dq); svv.fehler = 0; }
  catch (e) {
    if (e && (e.code === "ZERO_RESULTS" || /ZERO_RESULTS/.test(e.message || ""))) kand = { d: dq, id: null };   // hier gibt es kein Panorama
    else if (++svv.fehler <= 2) { weiter = false; svv.pause = Date.now() + 1500; }   // Netzfehler: gleich noch mal
    else svv.fehler = 0;
  }
  if (gen !== svv.gen) return;              // Kurs gewechselt oder gesprungen: svReset hat svv.frei schon gesetzt
  svv.frei = true;
  if (!weiter) return;
  svv.bis = dq;
  if (!kand || kand.id === sv.id || (kand.id && svv.liste.some(c => c.id === kand.id))
      || (svh.kand && svh.kand.id === kand.id)) return;
  svv.liste.push(kand);
  svv.liste.sort((a, b) => a.d - b.d);
}

// Nächstes Panorama im hinteren Fenster laden. Gewählt wird das erste, das bei aktuellem Tempo frühestens nach
// SV_MIN_MS erreicht wird; davor liegende würden ohnehin überholt (schnelle Fahrt) und fallen weg.
async function svVorbereiten() {
  const d = pos(), v = (z.tempo || 0) / 3.6;
  const warte = Math.max(0, SV_MIN_MS - (Date.now() - sv.zeitWechsel)) / 1000;
  const ab = sv.id ? d + v * warte - 5 : d - SV_ABSTAND;
  // Rückfall, wenn die Suche nicht hinterherkommt (langsames Netz): das jüngste Panorama, das noch nah genug ist
  const kand = svv.liste.find(c => c.id && c.d >= ab)
    || svv.liste.filter(c => c.id && c.d > sv.panoD && c.d >= d - 2 * SV_ABSTAND).pop();
  if (!kand) return;
  svv.liste = svv.liste.filter(c => !c.id || c.d > kand.d);
  svh.kand = kand; svh.status = "laedt";
  const gen = svv.gen, hinten = svPanos[1 - svVorn];
  hinten.setZoom(svZoom());
  hinten.setPov({ heading: kand.heading, pitch: kand.pitch });
  let st = "OK";
  if (hinten.getPano() !== kand.id || hinten.getStatus() !== "OK") {
    const geladen = panoGeladen(hinten, kand.id);
    hinten.setPano(kand.id);
    st = await geladen;
  }
  // Google stellt nach dem Laden den Zoom eigenmächtig um (gemessen 0,91 bzw. 1,26 statt 1,0); das neue Bild
  // blendete dann verstellt ein und svAnimieren zog es Sekundenbruchteile später zurück: Ruck in Gegenrichtung
  if (st === "OK") { hinten.setPov({ heading: kand.heading, pitch: kand.pitch }); hinten.setZoom(svZoom());
                     await new Promise(r => setTimeout(r, SV_RENDER_MS)); }
  if (gen !== svv.gen || svh.kand !== kand) return;
  if (st === "OK") svh.status = "bereit";
  else { svh.kand = null; svh.status = "leer"; }   // nicht geladen: verwerfen, das alte Bild bleibt stehen
}

function svWechseln() {
  const kand = svh.kand, neu = svPanos[1 - svVorn], elNeu = svEl(1 - svVorn), elAlt = svEl(svVorn);
  neu.setPov({ heading: kand.heading, pitch: kand.pitch });   // Google setzt den Blick nach dem Laden manchmal um
  if (Math.abs(neu.getZoom() - svZoom()) > 0.01) neu.setZoom(svZoom());   // … und den Zoom ebenso
  Object.assign(sv, { id: kand.id, heading: kand.heading, zielHeading: kand.heading, zielPitch: kand.pitch,
                      panoD: kand.d, distWechsel: pos(), zeitWechsel: Date.now(), datum: kand.datum, skala: 1 });
  sv.zahl++; if (kand.gegen) sv.gegen++;
  // altes Bild bleibt deckend, das neue blendet darüber ein
  elNeu.style.transition = "none"; elNeu.style.transform = "scale(1)"; elNeu.style.opacity = 0;
  elNeu.style.zIndex = 1; elAlt.style.zIndex = 0;
  void elNeu.offsetWidth;
  elNeu.style.transition = ""; elNeu.style.opacity = 1;
  svVorn = 1 - svVorn;
  svh.kand = null; svh.status = "blende";
  // Erst wenn das neue Bild deckend ist, wird das alte versteckt und darf das nächste laden (transitionend;
  // ein fester Timer kam bei belastetem Hauptthread zu früh: kurz schwarz)
  const gen = svv.gen;
  let fertig = false;
  const abschluss = () => {
    if (fertig) return;
    fertig = true; elNeu.removeEventListener("transitionend", ende);
    elAlt.style.transition = "none"; elAlt.style.opacity = 0; elAlt.style.transform = "scale(1)";
    void elAlt.offsetWidth; elAlt.style.transition = "";
    if (gen === svv.gen && svh.status === "blende") svh.status = "leer";
  };
  const ende = e => { if (e.propertyName === "opacity") abschluss(); };
  elNeu.addEventListener("transitionend", ende);
  setTimeout(abschluss, SV_BLENDE_MS + 2500);   // Rückfall, falls transitionend ausbleibt
  $("hinweis").textContent = (sv.datum ? `Street View ${sv.datum} · ` : "") + `${sv.zahl} Panoramen`
    + ` · ${Math.round(100 * (1 - sv.gegen / sv.zahl))} % in Fahrtrichtung`;
  if (!z.svAn) layout(true);
}

// Bewegung im Bild: Zoom wie echte Perspektive, Skala = T / (T − x) mit x = gefahrene Meter seit dem Panorama.
// Damit läuft das Bild genau mit dem Tempo und ist beim nächsten Panorama etwa so groß wie dessen Bild; steht man,
// steht das Bild. In Kurven weniger (Zoom nach vorn passt dort nicht zur Fahrlinie).
function svBewegung(d) {
  if (!sv.id) return;
  const naechst = svh.kand || svv.liste.find(c => c.id && c.d > sv.panoD);
  const kurve = naechst ? Math.abs(winkelDiff(sv.heading, naechst.heading)) : 0;
  const x = Math.min(SV_TIEFE / 2, Math.max(0, d - sv.panoD));
  const voll = Math.min(KB_MAX, SV_TIEFE / (SV_TIEFE - x));
  let s = 1 + (voll - 1) * Math.max(0, 1 - kurve / 45);
  // nur vorwärts: wechselt das Ziel auf ein ferneres Panorama, sinkt f kurz – Bild hält dann still statt zurückzuzoomen
  // (ausgenommen Sprung zurück mit −100 m)
  if (d >= sv.distWechsel) s = Math.max(s, sv.skala);
  if (Math.abs(s - sv.skala) > 0.001) { sv.skala = s; svEl(svVorn).style.transform = `scale(${s.toFixed(4)})`; }
}

function streetView() {
  if (z.svStatus !== "bereit" || !z.kurs) return;
  const d = pos(), v = (z.tempo || 0) / 3.6;
  if (sv.id && d < sv.distWechsel - 60) svReset();   // Sprung zurück: Vorrat passt nicht mehr
  svv.liste = svv.liste.filter(c => c.d >= d - 2 * SV_ABSTAND || (!c.id && c.d >= d - SV_ABSTAND));   // weit überholt
  svSuchen();
  // kein Panorama an dieser Stelle: große Karte, sofern nicht gleich wieder eins kommt
  while (svv.liste.length && !svv.liste[0].id && svv.liste[0].d <= d) {
    svv.liste.shift();
    const bald = svv.liste.find(c => c.id && c.d <= d + SV_ABSTAND) || (svh.kand && svh.kand.d <= d + SV_ABSTAND);
    if (!bald) {
      sv.id = null; sv.heading = null;
      $("hinweis").textContent = "kein Street-View-Panorama hier";
      if (z.svAn) layout(false);
    }
  }
  if (svh.status === "leer") svVorbereiten();
  else if (svh.status === "bereit") {
    const k = svh.kand;
    // weit überholt und ein späteres liegt schon bereit im Vorrat: verwerfen und das spätere laden
    if (d > k.d + 2 * SV_ABSTAND && svv.liste.some(c => c.id && c.d <= d)) { svh.kand = null; svh.status = "leer"; }
    else if (!sv.id ? k.d <= d + SV_ABSTAND
             : k.d <= d + v * SV_BLENDE_MS / 2000 && Date.now() - sv.zeitWechsel >= SV_MIN_MS) svWechseln();
  }
  svBewegung(d);
}

// Blick und Zoom festhalten: Street View setzt nach einem Wechsel den Blick gelegentlich nachträglich
// auf die Aufnahmerichtung des Google-Autos (an Pässen oft bergab = rückwärts); dann zurückstellen
function svAnimieren() {
  const svPano = svPanos[svVorn];
  if (!svPano || !z.svAn || sv.heading == null || svPano.getPano() !== sv.id) return;
  const pov = svPano.getPov();
  if (Math.abs(winkelDiff(sv.heading, pov.heading)) > 3 || Math.abs(pov.pitch - sv.zielPitch) > 3)
    svPano.setPov({ heading: sv.heading, pitch: sv.zielPitch });
  if (Math.abs(svPano.getZoom() - svZoom()) > 0.01) svPano.setZoom(svZoom());
}
setInterval(svAnimieren, 1000);   // Akku: vorher 250 ms
// Diagnose in der Browser-Konsole: __svDiag() zeigt Position, sichtbares Panorama, hinteres Fenster und Vorrat
window.__svDiag = () => ({ pos: pos(), v: z.tempo, sv: { ...sv },
  vorn: svPanos[svVorn] ? { zoom: svPanos[svVorn].getZoom(), pov: svPanos[svVorn].getPov() } : null,
  hinten: svPanos[1 - svVorn] ? { zoom: svPanos[1 - svVorn].getZoom() } : null, svh: { st: svh.status, d: svh.kand && svh.kand.d },
  svv: { bis: svv.bis, frei: svv.frei, fehler: svv.fehler, liste: svv.liste.map(c => [Math.round(c.d), c.id ? c.id.slice(0, 4) : null]) } });

// ------------------------------------------------------------------ Bildschirm wach halten
let sperre = null;
async function wachHalten() {
  try { if ("wakeLock" in navigator && !sperre) { sperre = await navigator.wakeLock.request("screen"); sperre.onrelease = () => { sperre = null; }; } }
  catch (e) { /* nicht verfügbar: Auto-Sperre am iPad ausschalten */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (z.sim || geraet)) wachHalten(); });

// ------------------------------------------------------------------ Start
window.addEventListener("resize", () => { profilVorbereiten(); karte.invalidateSize(); zeichnen(); svZoomHalten(); });
// Google passt bei Größenänderung des Fensters (Knopfleiste auf/zu, Overlay) den Zoom an (gemessen 1,0 → 1,26)
// und svAnimieren holte das erst bis zu 1 s später zurück: sichtbarer Zoom-Ruck. Sofort und nachgezogen setzen.
function svZoomHalten() {
  const setzen = () => svPanos.forEach(p => { if (p && Math.abs(p.getZoom() - svZoom()) > 0.01) p.setZoom(svZoom()); });
  setzen(); requestAnimationFrame(setzen); setTimeout(setzen, 150); setTimeout(setzen, 400);
}
(async () => {
  layout(false);
  try {
    const cfg = await (await fetch("api/config")).json();
    z.masse = cfg.masse || 90;
    coachKonfigurieren(cfg.coaching);
    if (cfg.googleMapsKey) {
      googleLaden(cfg.googleMapsKey).catch(() => { $("hinweis").textContent = "Google Maps nicht ladbar"; });
    } else {
      $("hinweis").textContent = "ohne Street View (kein Schlüssel)";
    }
    await kurseLaden();
    // Demo: /?kurs=<datei>&sim=1 (Knopf „Los geht's“ in der Anleitung) wählt den Kurs und startet den Testmodus
    const q = new URLSearchParams(location.search);
    if (q.get("kurs") && kurseAlle.some(k => k.datei === q.get("kurs"))) {
      $("kurs").value = q.get("kurs"); await kursWaehlen(q.get("kurs"), null);
    }
    if (q.get("sim") === "1" && !z.sim) $("btnSim").click();
    if (q.has("kurs") || q.has("sim")) history.replaceState(null, "", location.pathname);
  } catch (e) {
    status("Server nicht erreichbar: " + e.message);
  }
  setInterval(takt, 200);
  setInterval(leisteSteuern, 500);
  setInterval(knoepfeAktualisieren, 500); knoepfeAktualisieren();
})();
geraeteAutomatisch();                      // unabhängig vom Server: erlaubte Geräte gleich beim Öffnen suchen
} // Ende Block
</script>
