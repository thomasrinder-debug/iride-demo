<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pBlau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="pGrau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="pOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1570f"/></marker>
  </defs>
  <style>
    .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .titel { font-size: 15px; font-weight: 700; fill: #57606a; letter-spacing: .3px; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .box.haupt { stroke: #1f6feb; stroke-width: 2; }
    .name { font-size: 16px; font-weight: 600; fill: #1f2328; }
    .unter { font-size: 12.5px; fill: #57606a; }
    .lbl { font-size: 13px; fill: #1f2328; }
    .lblBlau { fill: #0b55c2; }
    .lblOrange { fill: #b34700; font-weight: 600; }
    .blau { stroke: #1f6feb; stroke-width: 2.2; fill: none; }
    .grau { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .gestr { stroke-dasharray: 6 5; }
    .orange { stroke: #d1570f; stroke-width: 5; fill: none; }
  </style>

  <rect x="0" y="0" width="1000" height="560" rx="14" fill="#ffffff"/>

  <!-- Panels -->
  <rect class="panel" x="20" y="64" width="250" height="380" rx="12"/>
  <text class="titel" x="40" y="88">INTERNET</text>
  <rect class="panel" x="335" y="64" width="310" height="380" rx="12"/>
  <text class="titel" x="355" y="88">PC ODER MAC</text>
  <rect class="panel" x="710" y="64" width="270" height="380" rx="12"/>
  <text class="titel" x="730" y="88">AM RAD</text>

  <!-- Linien (unter den Kästen) -->
  <!-- Garmin Connect -> Edge: einmal vor der Fahrt -->
  <path class="grau gestr" d="M145,104 V36 H845 V100" marker-end="url(#pGrau)"/>
  <text class="lbl" x="495" y="28" text-anchor="middle">Kurs-Sync über die Garmin-Connect-App (vor der Fahrt)</text>
  <!-- Server -> Garmin Connect -->
  <path class="grau gestr" d="M390,132 H252" marker-end="url(#pGrau)"/>
  <text class="lbl" x="321" y="122" text-anchor="middle">Kurs</text>
  <!-- Server -> Chrome -->
  <path class="grau" d="M490,160 V300" marker-end="url(#pGrau)"/>
  <text class="lbl" x="500" y="225">Seite, Kurse,</text>
  <text class="lbl" x="500" y="242">Katalog</text>
  <!-- Street View -> Chrome -->
  <path class="grau gestr" d="M245,262 C300,262 330,318 383,318" marker-end="url(#pGrau)"/>
  <text class="lbl" x="296" y="252" text-anchor="middle">Bilder</text>
  <!-- OSM -> Chrome -->
  <path class="grau" d="M245,372 C300,372 330,350 383,350" marker-end="url(#pGrau)"/>
  <text class="lbl" x="296" y="392" text-anchor="middle">Karte</text>
  <!-- Kickr -> Chrome -->
  <path class="blau" d="M745,282 C690,282 650,318 598,318" marker-end="url(#pBlau)"/>
  <text class="lbl lblBlau" x="676" y="262" text-anchor="middle">Leistung, Tempo,</text>
  <text class="lbl lblBlau" x="676" y="278" text-anchor="middle">Trittfrequenz</text>
  <!-- HF -> Chrome -->
  <path class="blau" d="M745,392 C690,392 650,350 598,350" marker-end="url(#pBlau)"/>
  <text class="lbl lblBlau" x="676" y="410" text-anchor="middle">Puls</text>
  <!-- Edge -> Kickr: Widerstand -->
  <path class="orange" d="M845,160 V244" marker-end="url(#pOrange)"/>
  <text class="lbl lblOrange" x="858" y="196">Steigung (SIM)</text>
  <text class="lbl" x="858" y="213">ANT+ / Bluetooth</text>

  <!-- Kästen -->
  <rect class="box" x="45" y="104" width="200" height="56" rx="10"/>
  <text class="name" x="145" y="129" text-anchor="middle">Garmin Connect</text>
  <text class="unter" x="145" y="148" text-anchor="middle">nur mit Edge</text>

  <rect class="box" x="45" y="234" width="200" height="56" rx="10"/>
  <text class="name" x="145" y="259" text-anchor="middle">Google Street View</text>
  <text class="unter" x="145" y="278" text-anchor="middle">freiwillig, eigener Schlüssel</text>

  <rect class="box" x="45" y="344" width="200" height="56" rx="10"/>
  <text class="name" x="145" y="369" text-anchor="middle">OpenStreetMap</text>
  <text class="unter" x="145" y="388" text-anchor="middle">Kartenkacheln</text>

  <rect class="box" x="390" y="104" width="200" height="56" rx="10"/>
  <text class="name" x="490" y="129" text-anchor="middle">iRide-Server</text>
  <text class="unter" x="490" y="148" text-anchor="middle">Python · localhost:8765</text>

  <rect class="box haupt" x="390" y="300" width="200" height="70" rx="10"/>
  <text class="name" x="490" y="329" text-anchor="middle">Chrome</text>
  <text class="unter" x="490" y="348" text-anchor="middle">iRide-Anzeige</text>
  <text class="unter" x="490" y="363" text-anchor="middle">Web Bluetooth</text>

  <rect class="box" x="745" y="104" width="200" height="56" rx="10"/>
  <text class="name" x="845" y="129" text-anchor="middle">Garmin Edge</text>
  <text class="unter" x="845" y="148" text-anchor="middle">„Strecke folgen“</text>

  <rect class="box" x="745" y="254" width="200" height="56" rx="10"/>
  <text class="name" x="845" y="279" text-anchor="middle">Wahoo Kickr</text>
  <text class="unter" x="845" y="298" text-anchor="middle">Rollentrainer</text>

  <rect class="box" x="745" y="364" width="200" height="56" rx="10"/>
  <text class="name" x="845" y="389" text-anchor="middle">HF-Brustgurt</text>
  <text class="unter" x="845" y="408" text-anchor="middle">freiwillig</text>

  <!-- Legende -->
  <line class="blau" x1="30" y1="482" x2="80" y2="482"/>
  <text class="lbl" x="90" y="487">Live-Daten per Bluetooth an Chrome</text>
  <line class="orange" x1="330" y1="482" x2="380" y2="482"/>
  <text class="lbl" x="390" y="487">stellt den Widerstand am Kickr</text>
  <line class="grau" x1="620" y1="482" x2="670" y2="482"/>
  <text class="lbl" x="680" y="487">lokal / Internet</text>
  <line class="grau gestr" x1="800" y1="482" x2="850" y2="482"/>
  <text class="lbl" x="860" y="487">optional</text>
  <text class="unter" x="30" y="528">Testmodus: nur PC/Mac mit Chrome – kein Kickr, kein Edge, kein Konto nötig. iRide liest den Kickr, steuert ihn aber nicht.</text>
</svg>
